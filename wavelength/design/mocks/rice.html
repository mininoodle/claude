<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wavelength rice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* =============================================================================
   Wavelength / direction "rice" — design mock (static, standalone)
   Literal translation of the reference: floating terminal windows on a black
   field, tiny white bitmap type, hairline rules that stop short, "− ×" pairs,
   prompt titles, white flower silhouettes. Colour only ever arrives through a
   media filter (mono by default).
   ========================================================================== */
:root{
  color-scheme: dark;
  /* field + greys (the only UI colours) */
  --void:#000;            /* the field; also every window, menu, dialog fill   */
  --ink-1:#0c0c0c;        /* wells: inputs, menus at rest                        */
  --ink-2:#161616;        /* hover row                                           */
  --ink-3:#2a2a2a;        /* open submenu parent, pressed                        */
  --rule:#d9d9d9;         /* hairline rules, window controls                     */
  --rule-dim:#4d4d4d;     /* dashed rules, slider tracks, separators             */
  --fg-hi:#ffffff;        /* titles, current, silhouettes, primary buttons      */
  --fg:#d9d9d9;           /* body text                                           */
  --fg-sub:#8f8f8f;       /* secondary text, values, meta                        */
  --fg-dim:#575757;       /* disabled, ghost text, placeholders                  */
  --sel-bg:#d9d9d9;       /* inverse video: selected row, focused menu item      */
  --sel-fg:#000;
  /* type: DotGothic16 is a 16-dot bitmap face; 16/32px land on its pixel grid */
  --font:'DotGothic16','MS Gothic','Osaka-Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --fs-label:12px;  --lh-label:16px;   /* meta, sublines, controls, chips, readout values */
  --fs-body:16px;   --lh-body:20px;    /* names, titles, prompts, menu items, clock       */
  --fs-title:32px;  --lh-title:36px;   /* page titles (hero h1)                           */
  --bold:1px 0 0 currentColor;         /* bitmap bold: the glyph smeared 1px right        */
  --bold-s:.5px 0 0 currentColor;
  /* window chrome */
  --hair:1px;
  --win-top:20px;          /* space from window top edge to the first content line */
  --ctl-gap:14px;          /* gap between the end of the rule and the − × pair    */
  --dash:repeating-linear-gradient(90deg,var(--rule) 0 3px,transparent 3px 5px);
  --dash-dim:repeating-linear-gradient(90deg,var(--rule-dim) 0 3px,transparent 3px 5px);
  /* layout */
  --pad:32px; --gutter:48px; --side-w:232px; --top-h:72px; --player-h:88px;
  /* media filter (overridden by [data-filter]) */
  --media-filter:grayscale(1) contrast(1.12) brightness(1.03);
  --avatar-bg:#e8115b;
}
[data-filter="mono"]  {--media-filter:grayscale(1) contrast(1.12) brightness(1.03)}
[data-filter="dither"]{--media-filter:url(#f-dither)}
[data-filter="invert"]{--media-filter:grayscale(1) invert(1) contrast(1.05)}
[data-filter="color"] {--media-filter:none}
[data-filter="ink"]   {--media-filter:url(#f-ink)}

*,*::before,*::after{box-sizing:border-box}
html{background:var(--void);scrollbar-width:thin;scrollbar-color:#333 transparent}
body{margin:0;background:var(--void);color:var(--fg);font:var(--fs-label)/var(--lh-label) var(--font);-webkit-font-smoothing:none;font-smooth:never;font-synthesis:none;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:disabled{cursor:default;color:var(--fg-dim)}
a{color:inherit;text-decoration:none}
ul{list-style:none;margin:0;padding:0}
h1,h2,h3,p,dl,dd{margin:0}
img{display:block}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible,.fv{outline:1px dashed var(--fg-hi)!important;outline-offset:3px;box-shadow:none}
.sprite,.defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---- primitives ---------------------------------------------------------- */
.icon{width:16px;height:16px;flex:none;fill:currentColor;shape-rendering:crispEdges;display:block}
.icon--lg{width:32px;height:32px}
.b{text-shadow:var(--bold)}
.dim{color:var(--fg-sub)}
.cover{width:100%;aspect-ratio:1;object-fit:cover;background:#111;filter:var(--media-filter);image-rendering:auto}
.cover--round{border-radius:50%}
.tint{filter:var(--media-filter)}                 /* any colour-bearing layer */
.caret{display:inline-block;color:var(--fg-hi);animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dash{display:block;height:1px;background:var(--dash)}
.dash--dim{background:var(--dash-dim)}

/* ---- window chrome (pure CSS, works on any element) ---------------------
   ::before = the hairline rule that stops short, ::after = the − × pair.
   --rule-w shortens the rule (the look_in.txt window stops at ~60%). */
.win{position:relative;padding-top:var(--win-top)}
.win::before{content:"";position:absolute;left:0;top:9px;height:var(--hair);background:var(--rule);
  width:calc(var(--rule-w,100%) - 26px - var(--ctl-gap));pointer-events:none}
.win::after{content:"\2212\00a0\00d7";position:absolute;right:0;top:0;font:12px/12px var(--font);color:var(--rule);pointer-events:none;letter-spacing:0}
.win__t{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--fg-hi);white-space:nowrap}
.win__t::before,.pr::before{content:">\00a0";color:var(--fg-hi)}
/* rules stop short by different amounts, like the reference (83% / 83% / 57%) */
.shelf{--rule-w:74%}
.shelf + .shelf{--rule-w:58%}
.shelf + .shelf + .shelf{--rule-w:80%}
.win--quick{--rule-w:86%}
.track-table{--rule-w:66%}
.corners{position:relative}
.corners::before,.corners::after{content:"";position:absolute;bottom:-7px;height:1px;background:var(--rule)}
.corners::before{left:-4px;width:22px}
.corners::after{right:-4px;width:30px}

/* ---- buttons ----------------------------------------------------------- */
.icon-btn{display:inline-grid;place-items:center;width:28px;height:28px;color:var(--fg-sub);position:relative}
.icon-btn:hover,.icon-btn.is-hover{color:var(--fg-hi)}
.icon-btn.is-active{color:var(--fg-hi)}
.icon-btn--dot.is-active::after{content:"";position:absolute;left:50%;bottom:0;width:6px;height:1px;margin-left:-3px;background:var(--fg-hi)}
.icon-btn:active{transform:translateY(1px)}
.play-btn{display:inline-grid;place-items:center;width:32px;height:32px;background:var(--fg-hi);color:#000;flex:none;border:1px solid var(--fg-hi)}
.play-btn:hover,.play-btn.is-hover{background:#000;color:var(--fg-hi)}
.play-btn:active{background:var(--fg-sub);border-color:var(--fg-sub);color:#000}
.play-btn--lg{width:40px;height:40px}
.text-btn{color:var(--fg-sub);font-size:var(--fs-body);line-height:28px;padding:0 4px;white-space:nowrap}
.text-btn::before{content:"[\00a0"}.text-btn::after{content:"\00a0]"}
.text-btn:hover{color:var(--fg-hi)}
.pill{height:28px;padding:0 12px;font-size:var(--fs-body);color:var(--fg);box-shadow:inset 0 0 0 1px var(--rule-dim)}
.pill:hover{box-shadow:inset 0 0 0 1px var(--fg-hi);color:var(--fg-hi)}
.pill--primary{background:var(--fg-hi);color:#000;box-shadow:none}
.pill--primary:hover{background:#000;color:var(--fg-hi);box-shadow:inset 0 0 0 1px var(--fg-hi)}
/* flags: chips render as command-line switches; the pressed one is bracketed */
.chip{font-size:var(--fs-label);line-height:20px;color:var(--fg-sub);white-space:nowrap;padding:0 1px}
.chip::before{content:"[--";color:transparent}
.chip::after{content:"]";color:transparent}
.chip:hover{color:var(--fg-hi)}
.chip:hover::before{content:"\00a0--";color:var(--fg-sub)}
.chip[aria-pressed="true"]{color:var(--fg-hi);text-shadow:var(--bold-s)}
.chip[aria-pressed="true"]::before{content:"[--";color:var(--fg-hi)}
.chip[aria-pressed="true"]::after{color:var(--fg-hi)}
.chip{text-transform:lowercase}
.chip:not([aria-pressed="true"])::before{content:"\00a0--";color:var(--fg-dim)}
.avatar{display:inline-grid;place-items:center;width:24px;height:24px;font-size:var(--fs-label);color:#fff;position:relative;isolation:isolate}
.avatar::before{content:"";position:absolute;inset:0;background:var(--avatar-bg);filter:var(--media-filter);z-index:-1}
.avatar--24{width:20px;height:20px}

/* the filter switcher (terminal radio group) */
.fsw{display:flex;align-items:center;gap:2px;font-size:var(--fs-label);white-space:nowrap}
.fsw__label{color:var(--fg-sub);margin-right:6px}
.fsw__label::before{content:">\00a0";color:var(--fg-hi)}
.fsw button{color:var(--fg-sub);padding:0 3px;line-height:20px}
.fsw button::before{content:"[";color:transparent}.fsw button::after{content:"]";color:transparent}
.fsw button:hover{color:var(--fg-hi)}
.fsw button[aria-checked="true"]{color:var(--fg-hi);text-shadow:var(--bold-s)}
.fsw button[aria-checked="true"]::before,.fsw button[aria-checked="true"]::after{color:var(--fg-hi)}

/* =============================================================================
   APP FRAME (desktop >= 1024)
   ========================================================================== */
.frame{position:relative;height:100vh;height:100svh;min-height:680px;max-height:900px;overflow:hidden;z-index:1}
.frame + .frame{border-top:1px dashed #1c1c1c}
.app{position:relative;display:grid;height:100%;padding:0 var(--pad);
  grid-template-columns:var(--side-w) minmax(0,1fr);column-gap:var(--gutter);
  grid-template-rows:var(--top-h) minmax(0,1fr) var(--player-h);
  grid-template-areas:"top top" "side main" "player player"}
.mini-player,.bottom-nav{display:none}

/* ---- top bar ---------------------------------------------------------- */
.topbar{grid-area:top;display:grid;grid-template-columns:var(--side-w) minmax(0,560px) 1fr;column-gap:var(--gutter);align-items:start;padding-top:12px}
.topbar__logo{display:flex;align-items:center;gap:10px;height:28px;margin-top:20px;color:var(--fg-hi)}
.topbar__logo svg{width:22px;height:22px;flex:none}
.wordmark{font-size:var(--fs-body);letter-spacing:0;color:var(--fg-hi)}
.wordmark::after{content:"_";animation:blink 1.06s steps(1) infinite}
.topbar__center{--rule-w:62%}
.search-row{display:flex;align-items:center;gap:8px;height:28px}
.round-btn{display:grid;place-items:center;width:28px;height:28px;color:var(--fg-sub)}
.round-btn:hover,.round-btn.is-active{color:var(--fg-hi)}
.search-pill{flex:1;display:flex;align-items:center;min-width:0;height:28px;position:relative}
.search-pill__path{color:var(--fg-hi);font-size:var(--fs-body);white-space:nowrap;margin-right:16px}
.search-pill__field{position:relative;flex:1;min-width:0;height:28px;display:flex;align-items:center}
.search-pill__input{width:100%;height:28px;background:none;border:0;outline:0;padding:0 0 0 12px;font-size:var(--fs-body);color:var(--fg-hi);caret-color:var(--fg-hi)}
.search-pill__input::placeholder{color:var(--fg-dim);opacity:1}
.search-pill__input::-webkit-search-cancel-button{display:none}
.search-pill__field .caret{position:absolute;left:0;top:4px;font-size:var(--fs-body);line-height:20px;pointer-events:none}
.search-pill__field:focus-within .caret{display:none}
.search-pill__divider{display:none}
.topbar .dash{margin-top:6px}
.topbar__right{display:flex;align-items:center;justify-content:flex-end;gap:18px;height:28px;margin-top:20px}
.avatar-btn{display:grid;place-items:center}
.avatar-btn:hover .avatar{outline:1px solid var(--fg-hi);outline-offset:2px}

/* ---- library window ----------------------------------------------------- */
.sidebar{grid-area:side;display:flex;flex-direction:column;min-height:0;--rule-w:92%}
.lib-header{display:flex;align-items:center;justify-content:space-between;height:24px}
.lib-title{display:flex;align-items:center;color:var(--fg-hi);font-size:var(--fs-body);white-space:nowrap}
.lib-title .icon{display:none}
.lib-title span{text-transform:lowercase}
.lib-title span::before{content:">\00a0"}
.lib-add{margin-right:-6px}
.lib-chips{display:flex;gap:6px;margin:10px 0 2px -4px}
.lib-filter{display:flex;align-items:center;justify-content:space-between;height:28px;margin:0 -6px 6px -6px}
.lib-sort{display:flex;align-items:center;gap:4px;color:var(--fg-sub);font-size:var(--fs-label);text-transform:lowercase}
.lib-sort:hover{color:var(--fg-hi)}
.lib-list{overflow:auto;min-height:0;flex:1;scrollbar-width:none;margin:0 -8px 0 -16px;padding:0 8px 0 16px;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent);mask-image:linear-gradient(#000 calc(100% - 28px),transparent)}
.lib-row{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:5px 0}
.lib-row__cover{position:relative;width:32px;height:32px}
.lib-row__cover .cover{width:32px;height:32px}
.lib-row__text{min-width:0;display:flex;flex-direction:column}
.lib-row .name{font-size:var(--fs-body);line-height:20px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-row .sub{display:flex;align-items:center;gap:4px;color:var(--fg-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:lowercase}
.lib-row .sub .icon{width:16px;height:16px;margin:0 -3px 0 -4px}
.lib-row:hover,.lib-row.is-hover{background:var(--ink-2)}
.lib-row:hover .name{color:var(--fg-hi)}
.lib-row::before{content:">";position:absolute;left:-16px;top:50%;margin-top:-10px;line-height:20px;font-size:var(--fs-body);color:var(--fg-hi);opacity:0}
.lib-row.is-active::before{opacity:1}
.lib-row.is-active .name{color:var(--fg-hi)}
.lib-row.is-current .name{color:var(--fg-hi);text-shadow:var(--bold)}
.lib-row__end{color:var(--fg-hi);padding-right:2px}
.lib-row__speaker{animation:blink 1.6s steps(1) infinite}
.lib-row__play{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.6);color:#fff}
.lib-row:hover .lib-row__play{display:grid}
.lib-sec{color:var(--fg-dim);margin:14px 0 4px;text-transform:lowercase}
.lib-sec::before{content:"#\00a0"}

/* ---- main field ---------------------------------------------------------- */
.main{grid-area:main;position:relative;min-height:0;overflow:auto;scrollbar-width:none;padding-left:16px;margin-left:-16px;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 36px),transparent);mask-image:linear-gradient(#000 calc(100% - 36px),transparent)}
.main::-webkit-scrollbar,.lib-list::-webkit-scrollbar{display:none}
.main-header{display:flex;align-items:center;gap:6px;height:24px;margin-top:4px;color:var(--fg-sub)}
.main-header__nav{display:flex;gap:2px;margin-left:-6px}
.nav-btn{display:grid;place-items:center;width:20px;height:20px;color:var(--fg-sub)}
.nav-btn:hover{color:var(--fg-hi)}
.nav-btn:disabled{color:var(--fg-dim)}
.main-header__path{white-space:nowrap;margin-left:6px}
.main-header__path b{color:var(--fg-hi);font-weight:400}
.main-header__end{margin-left:auto;display:flex;gap:4px}
.page{padding:0 0 48px}

/* home: the system band (branch + readout) and the right-hand stack */
.band{display:grid;grid-template-columns:minmax(0,1fr) 352px;column-gap:var(--gutter);margin-top:8px;align-items:start}
.neo{display:grid;grid-template-columns:236px minmax(0,1fr);column-gap:20px;align-items:center;min-height:196px}
.neo__flora{width:236px;height:196px;display:block}
.neo__info{display:flex;flex-direction:column;gap:2px;font-size:var(--fs-label);line-height:var(--lh-label);white-space:nowrap}
.neo__info div{display:flex;gap:6px}
.neo__info dt{color:var(--fg-hi);text-shadow:var(--bold-s)}
.neo__info dd{color:var(--fg)}
.neo__info .gap{height:14px}
.neo__info .hz{font-family:var(--font)}
.stack{display:flex;flex-direction:column;gap:12px;padding-top:0}
.win--time{--rule-w:72%}
.win--time .clock{margin-left:3ch}
.clock{color:var(--fg-hi);font-variant-numeric:tabular-nums}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:20px;row-gap:0;margin-top:6px}
.quick-tile{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:center;height:26px;width:100%;padding-right:2px}
.quick-tile .cover{width:24px;height:24px}
.quick-tile__name{font-size:var(--fs-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.quick-tile .play-btn{position:absolute;right:2px;top:3px;width:20px;height:20px;opacity:0}
.quick-tile .play-btn .icon{width:16px;height:16px}
.quick-tile:hover,.quick-tile.is-hover{background:var(--ink-2)}
.quick-tile:hover .quick-tile__name,.quick-tile.is-hover .quick-tile__name{color:var(--fg-hi)}
.quick-tile:hover .quick-tile__name,.quick-tile.is-hover .quick-tile__name,.quick-tile.is-playing .quick-tile__name{padding-right:26px}
.quick-tile:hover .play-btn,.quick-tile.is-hover .play-btn,.quick-tile.is-playing .play-btn{opacity:1}
.quick-tile.is-current .quick-tile__name{color:var(--fg-hi);text-shadow:var(--bold)}

/* shelves: each shelf is a window, its title the prompt */
.shelf{margin-top:18px}
.shelf__head{display:flex;align-items:baseline;justify-content:space-between;height:20px}
.shelf__title{font-size:var(--fs-body);color:var(--fg-hi);text-transform:lowercase}
.shelf__title::before{content:">\00a0"}
.shelf__title:hover{text-decoration:underline dashed 1px;text-underline-offset:4px}
.shelf__all{color:var(--fg-sub);text-transform:lowercase;margin-right:42px}
.shelf__all:hover{color:var(--fg-hi)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));column-gap:24px;margin-top:10px}
.card-grid--row{grid-template-rows:auto;grid-auto-rows:0;overflow:hidden;row-gap:0}
.card{position:relative;min-width:0;cursor:pointer;padding-bottom:4px}
.card__cover{position:relative}
.card .play-btn{position:absolute;right:6px;bottom:6px;width:28px;height:28px;opacity:0;transform:translateY(4px);transition:opacity .12s steps(2),transform .12s steps(2)}
.card:hover .play-btn,.card.is-hover .play-btn,.card.is-playing .play-btn,.card:focus-visible .play-btn{opacity:1;transform:none}
.card__text{margin-top:6px}
.card__title{font-size:var(--fs-body);line-height:20px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:hover .card__title,.card.is-hover .card__title{color:var(--fg-hi)}
.card.is-current .card__title{color:var(--fg-hi);text-shadow:var(--bold)}
.card__sub{color:var(--fg-sub);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card:hover .card__cover::after,.card.is-hover .card__cover::after{content:"";position:absolute;inset:-4px;outline:1px solid var(--rule-dim);pointer-events:none}
.card--round .card__text{text-align:left}

/* ---- playlist page -------------------------------------------------------- */
.hero{display:grid;grid-template-columns:156px minmax(0,1fr) 170px;column-gap:28px;align-items:end;margin-top:14px}
.hero__cover{width:156px}
.hero__info{display:flex;flex-direction:column;gap:6px;min-width:0;padding-bottom:2px}
.hero__type{color:var(--fg-sub);text-transform:lowercase}
.hero__type::before{content:"type:\00a0";color:var(--fg-dim)}
.hero__title{font-size:var(--fs-title);line-height:var(--lh-title);font-weight:400;color:var(--fg-hi);letter-spacing:0;margin:2px 0 4px}
.hero__desc{color:var(--fg-sub);max-width:58ch}
.hero__meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--fg-sub)}
.hero__meta b{font-weight:400;color:var(--fg-hi)}
.hero__hue{display:flex;align-items:center;gap:6px;color:var(--fg-dim)}
.hero__hue i{width:10px;height:10px;background:var(--hero-color);filter:var(--media-filter);display:block}
.hero__sprig{width:170px;height:170px;align-self:end}
.actions{display:flex;align-items:center;gap:10px;margin:26px 0 0}
.actions .play-btn{margin-right:8px}
.actions__right{margin-left:auto;display:flex;align-items:center;gap:6px;margin-right:2px}
.view-toggle{display:flex;align-items:center;gap:4px;color:var(--fg-sub);text-transform:lowercase}
.view-toggle:hover{color:var(--fg-hi)}

.track-table{margin-top:22px;--cols:24px minmax(0,6fr) minmax(0,4fr) minmax(0,3fr) 96px}
.track-table__head{display:grid;grid-template-columns:var(--cols);column-gap:16px;align-items:center;height:28px;margin-top:6px;padding:0 8px;color:var(--fg-sub);text-transform:lowercase}
.track-table__head .cell--dur{justify-self:end;padding-right:22px}
.track-table .dash{margin:0 0 6px}
.track-row{position:relative;display:grid;grid-template-columns:var(--cols);column-gap:16px;align-items:center;height:40px;padding:0 8px;cursor:default}
.track-row::before{content:">";position:absolute;left:-16px;top:10px;line-height:20px;font-size:var(--fs-body);color:var(--fg-hi);opacity:0}
.track-row__index{position:relative;display:grid;place-items:center;width:24px;height:24px;color:var(--fg-sub);font-variant-numeric:tabular-nums}
.track-row__index > *{grid-area:1/1}
.track-row__play{display:none;color:var(--fg-hi)}
.track-row__main{display:flex;align-items:center;gap:12px;min-width:0}
.track-row__cover{width:28px;height:28px;flex:none}
.track-row__text{display:flex;flex-direction:column;min-width:0}
.track-row__title{font-size:var(--fs-body);line-height:20px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-row__artist{display:flex;align-items:center;gap:6px;color:var(--fg-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-e{width:12px;height:12px;color:var(--fg-sub)}
.track-row__album,.track-row__date{color:var(--fg-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-row__end{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.track-row__dur{color:var(--fg-sub);font-variant-numeric:tabular-nums;width:4ch;text-align:right}
.track-row__like,.track-row__more{visibility:hidden;color:var(--fg-sub);display:grid;place-items:center}
.track-row__like:hover,.track-row__more:hover{color:var(--fg-hi)}
.track-row a:hover{color:var(--fg-hi);text-decoration:underline dashed 1px;text-underline-offset:3px}
/* hover: cursor in the gutter, faint fill, index becomes play */
.track-row:hover,.track-row.is-hover{background:var(--ink-2)}
.track-row:hover::before,.track-row.is-hover::before{opacity:1}
.track-row:hover .track-row__num,.track-row.is-hover .track-row__num{visibility:hidden}
.track-row:hover .track-row__play,.track-row.is-hover .track-row__play{display:grid}
.track-row:hover .track-row__like,.track-row:hover .track-row__more,.track-row.is-hover .track-row__like,.track-row.is-hover .track-row__more{visibility:visible}
.track-row:hover .track-row__title,.track-row.is-hover .track-row__title{color:var(--fg-hi)}
/* current / playing: white, bitmap bold, equaliser instead of the number */
.track-row.is-current .track-row__title{color:var(--fg-hi);text-shadow:var(--bold)}
.track-row.is-current .track-row__num{color:var(--fg-hi)}
.equaliser{display:none;align-items:flex-end;gap:2px;height:12px}
.equaliser i{display:block;width:2px;background:var(--fg-hi);height:4px;animation:eq 1.1s steps(4) infinite}
.equaliser i:nth-child(2){animation-delay:-.45s;animation-duration:.9s}
.equaliser i:nth-child(3){animation-delay:-.2s;animation-duration:1.3s}
@keyframes eq{0%{height:3px}25%{height:11px}50%{height:6px}75%{height:12px}100%{height:3px}}
.track-row.is-playing .track-row__num{visibility:hidden}
.track-row.is-playing .equaliser{display:flex}
.track-row.is-playing:hover .equaliser{display:none}
/* selected: inverse video (terminal selection) */
.track-row.is-selected{background:var(--sel-bg);color:var(--sel-fg)}
.track-row.is-selected::before{opacity:1}
.track-row.is-selected *{color:var(--sel-fg)!important;text-shadow:none}
.track-row.is-selected .track-row__like,.track-row.is-selected .track-row__more{visibility:visible}
.track-row.is-selected .track-row__cover{filter:var(--media-filter) contrast(.9)}
.track-row__like.is-liked{visibility:visible;color:var(--fg-hi)}

/* ---- player: the /media window ------------------------------------------ */
.player-bar{grid-area:player;display:grid;grid-template-columns:35% 37% 28%;align-items:center;align-self:start;margin-top:8px;--rule-w:100%}
.pb-left{display:grid;grid-template-columns:auto 44px minmax(0,1fr) auto;column-gap:14px;align-items:center;min-width:0}
.pb-left .win__t{margin-right:6px}
.pb-cover{position:relative;width:44px;height:44px;grid-column:2}
.pb-cover .cover{width:44px;height:44px}
.pb-cover__expand{position:absolute;top:2px;right:2px;display:none;width:16px;height:16px;place-items:center;background:#000;color:#fff}
.pb-cover:hover .pb-cover__expand{display:grid}
.pb-text{min-width:0;line-height:20px}
.pb-title,.pb-artist{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-title{font-size:var(--fs-body);color:var(--fg-hi)}
.pb-artist{color:var(--fg-sub)}
.pb-title::before{content:"Song:\00a0\00a0\00a0";font-size:var(--fs-label);color:var(--fg-hi);text-shadow:var(--bold-s)}
.pb-artist::before{content:"Author:\00a0";color:var(--fg-hi);text-shadow:var(--bold-s)}
.pb-title a:hover,.pb-artist a:hover{text-decoration:underline dashed 1px;text-underline-offset:3px}
.pb-center{display:flex;flex-direction:column;align-items:center;gap:6px}
.pb-controls{display:flex;align-items:center;gap:14px}
.pb-progress{display:grid;grid-template-columns:5ch minmax(0,1fr) 5ch;align-items:center;gap:10px;width:100%;max-width:470px}
.pb-time{color:var(--fg-sub);font-variant-numeric:tabular-nums;text-align:right}
.pb-time--total{text-align:left}
.pb-right{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.pb-volume{display:flex;align-items:center;gap:6px}
/* sliders: dashed rule = track, solid white = played, a block cursor = thumb */
.slider{-webkit-appearance:none;appearance:none;height:12px;background:
  linear-gradient(var(--fg-hi),var(--fg-hi)) 0 50%/var(--fill,0%) 1px no-repeat,
  var(--dash-dim) 0 50%/100% 1px no-repeat;margin:0;cursor:pointer;width:100%}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:5px;height:9px;background:var(--fg-hi);border:0;border-radius:0}
.slider::-moz-range-thumb{width:5px;height:9px;background:var(--fg-hi);border:0;border-radius:0}
.slider:hover{background:linear-gradient(var(--fg-hi),var(--fg-hi)) 0 50%/var(--fill,0%) 3px no-repeat,var(--dash) 0 50%/100% 1px no-repeat}
.slider--volume{width:93px}

/* ---- menus, toast, dialog -------------------------------------------------- */
.context-menu{position:absolute;z-index:60;background:#000;min-width:200px;width:max-content;padding:22px 0 6px;--rule-w:100%;
  box-shadow:0 0 0 1px #262626,0 18px 40px 8px #000}
.context-menu.win::before{left:10px;width:calc(100% - 20px - 26px - var(--ctl-gap))}
.context-menu.win::after{right:10px;top:4px}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;height:28px;padding:0 12px;font-size:var(--fs-body);color:var(--fg);white-space:nowrap}
.menu-item .icon{color:var(--fg-sub)}
.menu-item__label{flex:1}
.menu-item:hover,.menu-item.is-focused{background:var(--sel-bg);color:var(--sel-fg)}
.menu-item:hover .icon,.menu-item.is-focused .icon{color:var(--sel-fg)}
.menu-item.is-open{background:var(--ink-3);color:var(--fg-hi)}
.menu-item:disabled{color:var(--fg-dim)}
.menu-item--plain{padding-left:38px}
.menu-sep{height:1px;margin:6px 12px;background:var(--dash-dim)}
.menu-search{display:flex;align-items:center;gap:8px;height:30px;margin:0 12px 4px;color:var(--fg-sub)}
.menu-search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:var(--fs-body);color:var(--fg-hi)}
.menu-search input::placeholder{color:var(--fg-dim)}
.menu-search::after{content:"";position:absolute}
.toast-root{position:absolute;left:0;right:0;bottom:calc(var(--player-h) + 14px);display:flex;justify-content:center;pointer-events:none;z-index:70}
.toast{display:flex;align-items:center;gap:10px;background:var(--sel-bg);color:#000;font-size:var(--fs-body);line-height:20px;padding:6px 12px 6px 10px;box-shadow:0 0 0 4px #000}
.toast::before{content:"\2713";}
.toast__action{text-decoration:underline;text-underline-offset:3px}
.tooltip{position:absolute;z-index:70;background:#000;color:var(--fg-hi);font-size:var(--fs-label);padding:3px 7px;box-shadow:0 0 0 1px var(--rule-dim);white-space:nowrap;pointer-events:none}
.dialog-backdrop{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.78);z-index:2}
.dialog{position:relative;width:min(440px,calc(100% - 32px));background:#000;padding:28px 24px 22px;box-shadow:0 0 0 1px #2a2a2a;--rule-w:100%}
.dialog.win::before{left:24px;top:12px;width:calc(100% - 48px - 26px - var(--ctl-gap))}
.dialog.win::after{right:24px;top:6px}
.dialog__close{position:absolute;right:20px;top:2px;width:20px;height:20px;opacity:0}
.dialog__title{font-size:var(--fs-body);line-height:20px;font-weight:400;color:var(--fg-hi);margin-top:6px}
.dialog__title::before{content:">\00a0"}
.dialog__body{color:var(--fg-sub);font-size:var(--fs-label);margin-top:12px;padding-left:2ch}
.dialog__body b{font-weight:400;color:var(--fg-hi)}
.dialog__actions{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:26px}

/* ---- phone extras ------------------------------------------------------------ */
.fsw--phone,.chips.chips--phone,.chips .avatar,.toast-root--phone{display:none}
.chips--home{display:flex;gap:4px;align-items:center}

/* =============================================================================
   SHEETS (below the frames): states, filters, flora, tokens
   ========================================================================== */
.sheet{position:relative;z-index:1;padding:64px var(--pad) 24px}
.sheet__head{display:flex;align-items:baseline;gap:18px;margin-bottom:22px}
.sheet__head p{color:var(--fg-sub)}
.sheet .win{margin-bottom:0}
.ov-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:var(--gutter)}
.ov-grid > *{min-width:0}
.states__scroll{overflow-x:auto;scrollbar-width:none}
.ov-stage{position:relative;height:340px;overflow:hidden}
.ov-ghost{position:absolute;inset:0;padding:30px 24px;opacity:.5}
.empty{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;align-items:center;margin-top:12px}
.empty canvas{width:120px;height:150px}
.empty h3{font-size:var(--fs-body);line-height:20px;font-weight:400;color:var(--fg-hi)}
.empty p{color:var(--fg-sub);margin:6px 0 16px}
.states{margin-top:34px}
.states table{border-collapse:collapse;width:100%;margin-top:10px}
.states th{font-weight:400;color:var(--fg-dim);text-align:left;padding:4px 10px 8px 0;text-transform:lowercase}
.states td{padding:6px 10px 6px 0;vertical-align:middle}
.states td:first-child{color:var(--fg-sub);white-space:nowrap}
.filters{display:flex;flex-direction:column;gap:0}
.f-row{display:grid;grid-template-columns:150px minmax(0,1fr);column-gap:24px;align-items:center;padding:14px 0;border-top:1px solid #151515}
.f-row:first-of-type{border-top:0}
.f-row__name{font-size:var(--fs-body);color:var(--fg-hi)}
.f-row__name::before{content:"--"}
.f-row__def{color:var(--fg-sub);margin-top:4px;line-height:15px}
.f-covers{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:16px}
.browse-card{position:relative;aspect-ratio:1;overflow:hidden;isolation:isolate;box-shadow:inset 0 0 0 1px var(--rule-dim)}
.browse-card::before{content:"";position:absolute;inset:0;background:var(--browse-color);filter:var(--media-filter);z-index:-1}
.browse-card span{position:absolute;left:8px;top:6px;font-size:var(--fs-body);color:#fff}
.browse-card img{position:absolute;width:56%;right:-10%;bottom:-6%;transform:rotate(25deg)}
.flora-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:28px 24px}
.flora-grid figure{margin:0}
.flora-grid canvas{width:100%;aspect-ratio:1;display:block}
.flora-grid figcaption{margin-top:6px;color:var(--fg-sub)}
.flora-grid figcaption b{font-weight:400;color:var(--fg-hi)}
.flora-grid figcaption b::before{content:">\00a0"}
.tok{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gutter)}
.ramp{display:grid;grid-template-columns:28px 1fr auto;gap:6px 12px;align-items:center;margin-top:10px}
.ramp i{width:28px;height:14px;display:block;box-shadow:inset 0 0 0 1px #222}
.ramp span:last-child{color:var(--fg-dim)}
.typespec{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.typespec .t32{font-size:32px;line-height:36px;color:var(--fg-hi)}
.typespec .t16{font-size:16px;line-height:20px;color:var(--fg-hi)}
.typespec small{display:block;color:var(--fg-dim);font-size:12px}
.anat{position:relative;margin-top:12px;padding:8px 0 0}
.anat .demo{position:relative;--rule-w:58%}
.anat ol{margin:18px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px;color:var(--fg-sub)}
.anat ol b{font-weight:400;color:var(--fg-hi)}
.colophon{position:relative;z-index:1;padding:40px var(--pad) 60px;color:var(--fg-dim);display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.colophon .dash{flex:1 1 100%;margin-bottom:18px}

/* ---- petals layer ---------------------------------------------------------- */
#petals{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:0}

/* =============================================================================
   TABLET (768–1023): rail library, same windows
   ========================================================================== */
@media (min-width:768px) and (max-width:1023px){
  :root{--side-w:56px;--gutter:32px;--pad:24px}
  .lib-title span,.lib-chips,.lib-filter,.lib-row__text,.lib-row__end,.lib-sec{display:none}
  .lib-title .icon{display:block}
  .lib-header{flex-direction:column;height:auto;gap:8px;align-items:flex-start}
  .lib-row{grid-template-columns:32px}
  .topbar{grid-template-columns:var(--side-w) minmax(0,1fr) auto}
  .wordmark,.fsw__label,.pb-left .win__t{display:none}
  .band{grid-template-columns:1fr}
  .stack{display:grid;grid-template-columns:1fr 1fr;gap:var(--gutter)}
  .hero{grid-template-columns:140px minmax(0,1fr)}
  .hero__sprig{display:none}
  .track-table{--cols:24px minmax(0,6fr) minmax(0,4fr) 96px}
  .track-row__date,.cell--date{display:none}
  .ov-grid,.tok{grid-template-columns:1fr}
}

/* =============================================================================

   ========================================================================== */
@media (max-width:767px){
  :root{--pad:16px;--gutter:24px;--player-h:0px}
  .frame{height:100vh;height:100svh;min-height:640px;max-height:none}

  .topbar,.sidebar,.player-bar{display:none}

  .main-header{margin-top:14px}
  .main-header__end{display:none}
  .chips .avatar{display:inline-grid;margin-right:8px}
  .chips.chips--phone{display:flex;margin-top:12px}
  .fsw--phone{display:flex;margin-top:10px}
  .band{grid-template-columns:minmax(0,1fr);row-gap:24px;margin-top:14px}
  .neo{grid-template-columns:132px minmax(0,1fr);column-gap:16px;min-height:0}
  .neo__flora{width:132px;height:150px}
  .neo__info{font-size:12px}
  .neo__info .gap{height:8px}
  .stack{gap:22px}
  .quick-grid{column-gap:14px}
  .quick-tile .play-btn{display:none}
  .shelf{margin-top:26px}
  .shelf__all{margin-right:36px}
  .card-grid{display:flex;overflow-x:auto;gap:16px;scrollbar-width:none;margin-right:-16px;padding-right:16px}
  .card-grid .card{flex:0 0 128px}
  .card .play-btn{display:none}
  /* playlist */
  .hero{grid-template-columns:1fr;row-gap:18px;margin-top:16px}
  .hero__cover{width:150px}
  .hero__sprig{display:none}
  .hero__title{font-size:32px}
  .actions{gap:6px;margin-top:20px}
  .actions .play-btn{order:9;margin:0 0 0 auto}
  .actions__right{display:none}
  .track-table{--cols:minmax(0,1fr) auto;margin-top:18px}
  .track-table__head,.track-row__index,.track-row__album,.track-row__date,.track-row__dur,.track-row__like,.track-table > .dash{display:none}
  .track-row{height:52px;padding:0 6px 0 4px;column-gap:8px;cursor:pointer}
  .track-row::before{left:-14px}
  .track-row__cover{width:40px;height:40px}
  .track-row__more{visibility:visible}
  /* mini player = small /media window docked above the nav */
  .mini-player{grid-area:mini;display:block;position:relative;padding:20px 16px 0;background:#000;--rule-w:100%;isolation:isolate}
  .mini-player.win::before{left:16px;width:calc(100% - 32px - 26px - var(--ctl-gap))}
  .mini-player.win::after{right:16px}
  .mini-player__tint{position:absolute;inset:0;background:linear-gradient(transparent 0,var(--mini-color) 100%);opacity:.38;z-index:-1}
  .mini-player__inner{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;align-items:center;gap:12px;height:48px}
  .mini-player__inner .cover{width:40px;height:40px}
  .mini-player__title{font-size:var(--fs-body);line-height:20px;color:var(--fg-hi);white-space:nowrap;overflow:hidden}
  .mini-player__title::before{content:"Song:\00a0";font-size:12px;text-shadow:var(--bold-s)}
  .mini-player__artist{color:var(--fg-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini-player__artist::before{content:"Author:\00a0";color:var(--fg-hi);text-shadow:var(--bold-s)}
  .marquee__inner{display:inline}
  .mini-player__progress{height:9px;margin:4px 0 0;background:var(--dash-dim) 0 50%/100% 1px no-repeat}
  .mini-player__progress i{display:block;height:9px;width:var(--fill);background:linear-gradient(var(--fg-hi),var(--fg-hi)) 0 50%/100% 1px no-repeat;position:relative}
  .mini-player__progress i::after{content:"";position:absolute;right:-2px;top:2px;width:4px;height:5px;background:var(--fg-hi)}
  .bottom-nav{grid-area:nav;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;background:#000;padding:0 8px;border-top:1px dashed #2a2a2a}
  .bottom-nav__item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg-sub);text-transform:lowercase;font-size:12px}
  .bottom-nav__item.is-active{color:var(--fg-hi)}
  .bottom-nav__item.is-active::after{content:"";width:22px;height:1px;background:var(--fg-hi);margin-top:1px}
  .toast-root{bottom:calc(56px + 76px + 12px)}
  /* menus dock as sheets above the mini player; a submenu stacks above its parent */
  #playlist .context-menu,#playlist .toast-root{display:none}
  .track-row.is-selected,.track-row.is-hover{background:none}
  .track-row.is-selected *{color:inherit!important}
  .track-row.is-selected .track-row__title{color:var(--fg)!important}
  .track-row.is-selected .track-row__artist,.track-row.is-selected .track-row__artist a{color:var(--fg-sub)!important}
  .track-row.is-hover .track-row__title{color:var(--fg)}
  .track-row::before,.lib-row::before{display:none}
  .main{padding-left:16px;margin-left:0}
  .sheet{padding:48px 16px 16px}
  .ov-grid,.tok{grid-template-columns:1fr}
  .ov-stage{height:330px}
  .f-row{grid-template-columns:1fr;row-gap:10px}
  .f-covers{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .f-covers > :nth-child(n+5){display:none}
  .flora-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 16px}
  .states table{font-size:12px}
  .states .hide-s{display:none}
}
@media (prefers-reduced-motion: reduce){
  .caret,.wordmark::after,.lib-row__speaker{animation:none}
  .equaliser i{animation:none;height:8px}
  .card .play-btn{transition:none}
}

<!-- media filters. dither = ordered 4x4 Bayer threshold at 2px cells; ink = hard silhouette threshold -->

    </feComponentTransfer>
    <feImage id="bayer" x="0" y="0" width="8" height="8" preserveAspectRatio="none" result="cell"/>
    <feTile in="cell" result="tile"/>

function drawFlora(root) {
  $$('canvas[data-flora]', root).forEach((cv) => {
    const kind = cv.dataset.flora; const r = cv.getBoundingClientRect(); const w = r.width || 150, h = r.height || 150;
    if (!r.width) return;
    const c = hidpi(cv, w, h); const o = SIL(c, 1);
    if (kind === 'hero') {
      Flora.branch(c, w, h, Object.assign(o, { seed: HERO_SEED, species: ['peony', 'peony', 'sakura'], x: .8, y: 1.0, angle: -1.95, len: .8, width: .05, bloom: .1, cluster: .7, leafRate: .24, leafSize: .15, petals: 8, petalBox: [.0, .62, .34, .36], fork: .8, steps: 7, nodeBloom: .22, fit: 4, fitTop: 6, anchorX: .62, maxScale: 1.3 }));
    } else if (kind === 'sprig') {
      Flora.branch(c, w, h, Object.assign(o, { seed: 'rice-sprig-3', species: ['sakura', 'ume'], x: .08, y: 1.0, angle: -1.05, len: .82, width: .03, bloom: .085, cluster: .5, leafRate: .25, leafSize: .12, petals: 6, petalBox: [.6, .55, .38, .4], fork: .7, steps: 6, fit: 4, anchorX: .25, maxScale: 1.2 }));
    } else if (kind === 'empty') {
      c.strokeStyle = '#fff'; c.lineCap = 'round'; c.lineWidth = 1.6;
      c.beginPath(); c.moveTo(w * .62, h * .98); c.bezierCurveTo(w * .6, h * .6, w * .4, h * .34, w * .24, h * .4); c.stroke();
      Flora.leaf(c, w * .58, h * .72, w * .3, -.4, o);
      Flora.bud(c, w * .24, h * .4, w * .2, 2.2, o);
      Flora.loose(c, w * .74, h * .9, w * .07, .4, o, .5); Flora.loose(c, w * .3, h * .8, w * .06, 2.4, o, .6);
    } else if (kind.startsWith('sp:')) {
      const sp = kind.slice(3); const tall = sp === 'wisteria' || sp === 'magnolia';
      Flora.bloom(c, sp, w / 2, tall ? h * .56 : h / 2, Math.min(w, h) * (tall ? .32 : .4), sp === 'wisteria' || sp === 'magnolia' ? 0 : .2, Object.assign(o, { rnd: rng(sp) }));
    } else if (kind === 'branch') {
      Flora.branch(c, w, h, Object.assign(o, { seed: 'rice-inv-2', species: ['ume', 'sakura'], x: .9, y: 1, angle: -2.0, len: .85, width: .04, bloom: .1, cluster: .6, leafRate: .3, leafSize: .14, petals: 5, petalBox: [.05, .6, .3, .35], steps: 6, fork: .7, fit: 6, maxScale: 1.4 }));
    } else if (kind === 'parts') {
      Flora.leaf(c, w * .1, h * .3, w * .5, -.3, o);
      Flora.bud(c, w * .62, h * .3, w * .24, -1.2, o);
      Flora.bud(c, w * .2, h * .7, w * .2, -.4, o);
      for (let i = 0; i < 6; i++) Flora.loose(c, w * (.45 + (i % 3) * .17), h * (.62 + Math.floor(i / 3) * .2), w * .08, i * 1.1, o, .55 + (i % 3) * .2);
    }
  });
}
function placeMenus() {
  const fr = $('#playlist'); const m = $('.context-menu:not(.context-menu--sub)', fr), sm = $('.context-menu--sub', fr), row = $('.track-row.is-selected', fr);
  if (!m || !sm || !row || innerWidth < 768) return;
  const fb = fr.getBoundingClientRect(), rb = row.getBoundingClientRect();
  const px = fb.width - 32 - sm.offsetWidth - 2 - m.offsetWidth, py = rb.top - fb.top + rb.height / 2;
  const top = py + m.offsetHeight > fb.height - 96 ? py - m.offsetHeight : py;
  m.style.left = px + 'px'; m.style.top = top + 'px';
  const item = $('.menu-item.is-open', m);
  sm.style.left = (px + m.offsetWidth + 2) + 'px'; sm.style.top = (top + item.offsetTop - 22 - 34) + 'px';
}
function setFilter(f) {
  document.body.dataset.filter = f; store.set('rice-filter', f);
  $$('[data-filter-set]').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.filterSet === f)));
}
function bayer() {
  const M = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  const cv = document.createElement('canvas'); cv.width = cv.height = 8; const c = cv.getContext('2d'); const im = c.createImageData(8, 8);
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { const t = (M[y >> 1][x >> 1] + .5) / 16; const v = Math.round(255 * (1 - t)); const i = (y * 8 + x) * 4; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  c.putImageData(im, 0, 0);
  const fe = document.getElementById('bayer'); const url = cv.toDataURL('image/png');
  fe.setAttribute('href', url); fe.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', url);
}
function clockText(d) {
  const p = (n) => String(n).padStart(2, '0'); let h = d.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return p(d.getDate()) + '-' + p(d.getMonth() + 1) + '-' + d.getFullYear() + ' ' + p(h) + ':' + p(d.getMinutes()) + ' ' + ap;
}
function live() {
  const tick = () => { const t = clockText(new Date()); $$('[data-clock]').forEach((e) => { e.textContent = t; }); };
  tick(); setInterval(tick, 1000);
  let n = 0, t0 = performance.now();
  const loop = (t) => { n++; if (t - t0 >= 1000) { const fps = Math.round(n * 1000 / (t - t0)); $$('[data-fps]').forEach((e) => { e.textContent = fps; }); n = 0; t0 = t; } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  let sess = parseInt(store.get('rice-session') || '1206', 10) + 1; store.set('rice-session', String(sess));
  $$('[data-session]').forEach((e) => { e.textContent = sess; });
  let pos = 58; const dur = 191;
  setInterval(() => { pos = (pos + 1) % dur; const m = Math.floor(pos / 60) + ':' + String(pos % 60).padStart(2, '0');
    $$('[data-clock-pos]').forEach((e) => { e.textContent = m; }); $$('[data-seek]').forEach((e) => { e.value = Math.round(pos / dur * 1000); e.style.setProperty('--fill', (pos / dur * 100).toFixed(1) + '%'); });
    $$('.mini-player__progress i').forEach((e) => e.style.setProperty('--fill', (pos / dur * 100).toFixed(1) + '%')); }, 1000);
}
function petals() {
  const cv = document.getElementById('petals'); const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, c, P = [];
  const R = rng('petals');
  const make = (init) => ({ x: R() * W, y: init ? R() * H : -14, s: 5 + R() * 4.5, a: R() * TAU, va: (R() - .5) * 1.2, vy: 9 + R() * 14, ph: R() * TAU, sw: 12 + R() * 26, al: .4 + R() * .45, sq: .45 + R() * .55 });
  function size() { W = innerWidth; H = innerHeight; c = hidpi(cv, W, H); const n = W < 768 ? 7 : 12; P = Array.from({ length: n }, () => make(true)); }
  function draw(t, dt) {
    c.clearRect(0, 0, W, H);
    P.forEach((p, i) => {
      if (!reduce) { p.y += p.vy * dt; p.a += p.va * dt; p.ph += dt * .8; if (p.y > H + 12) P[i] = make(false); }
      const x = p.x + Math.sin(p.ph) * p.sw;
      c.globalAlpha = p.al; Flora.loose(c, x, p.y, p.s, p.a, { tones: ['#fff'] }, p.sq * (.6 + .4 * Math.abs(Math.sin(p.ph * 1.7))));
    });

  size(); addEventListener('resize', size);
  let last = performance.now();
  const loop = (t) => { const dt = Math.min(.05, (t - last) / 1000); last = t; draw(t, dt); if (!reduce) requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
async function mount() {
  try { await Promise.race([document.fonts.load("120px 'DotGothic16'", '0123456789'), new Promise((r) => setTimeout(r, 2500))]); } catch (e) {}
  const saved = store.get('rice-filter'); document.body.dataset.filter = ['mono', 'dither', 'invert', 'color', 'ink'].includes(saved) ? saved : 'mono';
  bayer();
  $('#home').innerHTML = frame('home');
  $('#playlist').innerHTML = frame('playlist');
  $('#overlays').innerHTML = overlaysHTML();
  $('#filters').innerHTML = filtersHTML();
  $('#flora').innerHTML = floraHTML();
  $('#tokens').innerHTML = tokensHTML();
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-filter-set]'); if (b) { setFilter(b.dataset.filterSet); return; }
    const chip = e.target.closest('.chip'); if (chip && chip.closest('.chips,.lib-chips')) { const g = chip.parentElement; $$('.chip', g).forEach((x) => x.setAttribute('aria-pressed', String(x === chip && x.getAttribute('aria-pressed') !== 'true' || (x === chip && g.classList.contains('chips'))))); }

    const b = e.target.closest && e.target.closest('[data-filter-set]'); if (!b || !/Arrow(Left|Right)/.test(e.key)) return;
    const all = $$('[data-filter-set]', b.parentElement); const i = all.indexOf(b) + (e.key === 'ArrowRight' ? 1 : -1); const n = all[(i + all.length) % all.length];

}
mount();
})();
