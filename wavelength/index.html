<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Wavelength</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
/* ---- styles.css ---- */
/* ============================================================================
   Wavelength — styles.css
   Owner: shell/css agent.
   Sections:
     1. Tokens (SPEC §2)                       4. Scrollbars (SPEC §2)
     2. Base reset (SPEC §3, verbatim)         5. Primitives (SPEC §3)
     3. #app grid + breakpoints (SPEC §10)
   Per the CSS ownership rule (SPEC §3) this file holds no component styles:
   everything rendered inside #topbar, #sidebar, #main, #right-panel,
   #bottom-nav, #context-menu, #dialog-root and #toast-root is styled in
   app.css, and everything inside #player-bar, #mini-player and
   #expanded-player (including .slider) in player.css.
   ========================================================================== */

/* ---------- 1. Tokens ---------------------------------------------------- */
:root {
  color-scheme: dark;
  --bg-base: #000000;
  --bg-panel: #121212;
  --bg-elevated: #1f1f1f;
  --bg-menu: #282828;
  --bg-highlight: #3e3e3e;
  --bg-tinted: rgba(255,255,255,.07);
  --bg-tinted-strong: rgba(255,255,255,.1);
  --bg-tinted-press: rgba(255,255,255,.04);
  --fg: #ffffff;
  --fg-sub: #b3b3b3;
  --fg-muted: #7f7f7f;
  --accent: #1ed760;
  --accent-hover: #3be477;
  --accent-press: #1fdf64;
  --on-accent: #000000;
  --liked-a: #450af5;
  --liked-b: #c4efd9;
  --liked-hero: #5038a0;
  --verified: #3d91f4;
  --danger: #f15e6c;
  --border: rgba(255,255,255,.1);
  --shadow-cover: 0 8px 40px rgba(0,0,0,.5);
  --radius-panel: 8px;
  --radius-card: 6px;
  --radius-pill: 500px;
  --font: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --gap: 8px;
  --topbar-h: 64px;
  --player-h: 80px;
  --sidebar-w: 300px;
  --sidebar-rail-w: 72px;
  --right-w: 300px;
  --bottom-nav-h: 56px;
  --mini-player-h: 56px;
  --focus-ring: 0 0 0 2px #ffffff;
  /* extra tokens (additions, not in SPEC §2) */
  --avatar-bg: #e8115b;              /* the "N" avatar disc */
  --shadow-menu: 0 16px 24px rgba(0,0,0,.3), 0 6px 8px rgba(0,0,0,.2);
  --shadow-toast: 0 4px 12px rgba(0,0,0,.4);
  --selected: rgba(255,255,255,.3);  /* .is-selected rows */
  --tile-hover: rgba(255,255,255,.2);
  --overlay: rgba(0,0,0,.5);
  --backdrop: rgba(0,0,0,.7);
}

/* ---------- 2. Base reset (verbatim from SPEC §3) ------------------------ */
*,*::before,*::after{box-sizing:border-box}
html,body,#app{height:100%}
body{font-family:var(--font);background:var(--bg-base);color:var(--fg);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default;color:var(--fg-muted)}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none;margin:0;padding:0}
h1,h2,h3,h4,p{margin:0}
img{display:block}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

/* base additions */
[hidden]{display:none!important}
body{font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--fg-sub);opacity:1}
input[type="search"]::-webkit-search-decoration,input[type="search"]::-webkit-search-cancel-button{display:none}
svg{display:block}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

/* ---------- 3. #app grid and breakpoints (SPEC §10) ---------------------- */
.app{
  --_side: var(--sidebar-w);
  display:grid;
  grid-template-columns: var(--_side) minmax(0,1fr);
  grid-template-rows: var(--topbar-h) minmax(0,1fr) var(--player-h);
  grid-template-areas: "topbar topbar" "sidebar main" "player player";
  gap: var(--gap);
  padding: 0 var(--gap);
  height:100%;
  min-height:0;
  overflow:hidden;
  position:relative;
}
#app[data-sidebar="rail"]{--_side: var(--sidebar-rail-w)}
#app[data-right="now-playing"],#app[data-right="queue"]{
  grid-template-columns: var(--_side) minmax(0,1fr) var(--right-w);
  grid-template-areas: "topbar topbar topbar" "sidebar main right" "player player player";
}
#topbar{grid-area:topbar;min-width:0;background:var(--bg-base);height:var(--topbar-h)}
#sidebar{grid-area:sidebar}
#main{grid-area:main}
#right-panel{grid-area:right}
#player-bar{grid-area:player;min-width:0;background:var(--bg-base);height:var(--player-h)}
#sidebar,#main,#right-panel{
  min-width:0;min-height:0;position:relative;
  background:var(--bg-panel);border-radius:var(--radius-panel);
  overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;
}
#main{isolation:isolate;outline:none;container-type:inline-size}
#main:focus-visible{box-shadow:none}
#mini-player,#bottom-nav,#expanded-player{display:none}
/* resizers: live in the 8px gaps beside #main (desktop only) */
.resizer{display:none;position:relative;z-index:10;cursor:col-resize;align-self:stretch}
.resizer::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;margin-left:-.5px;background:var(--fg);opacity:0;transition:opacity .15s}
.resizer:hover::after,.resizer.is-dragging::after{opacity:1}
#resizer-left{grid-area:sidebar;justify-self:end;width:var(--gap);margin-right:calc(-1 * var(--gap))}
#resizer-right{grid-area:right;justify-self:start;width:var(--gap);margin-left:calc(-1 * var(--gap))}
@media (min-width: 1024px){
  .resizer{display:block}
  #app:not([data-right="now-playing"]):not([data-right="queue"]) #resizer-right{display:none}
}
/* tablet: icon rail, no right panel, no resizers */
@media (min-width: 768px) and (max-width: 1023px){
  #app,#app[data-sidebar="full"]{--_side: var(--sidebar-rail-w);--rail-hide:none;--rail-cols:48px;--rail-pad:4px;--rail-just:center;--rail-dir:column}
  #app,#app[data-right="now-playing"],#app[data-right="queue"]{
    grid-template-columns: var(--_side) minmax(0,1fr);
    grid-template-areas: "topbar topbar" "sidebar main" "player player";
  }
  #right-panel,.resizer{display:none}
}
/* desktop rail (prefs.sidebarCollapsed): same variables as the tablet rail */
#app[data-sidebar="rail"]{--rail-hide:none;--rail-cols:48px;--rail-pad:4px;--rail-just:center;--rail-dir:column}
/* phone */
@media (max-width: 767px){
  .app,#app[data-right="now-playing"],#app[data-right="queue"]{
    grid-template-columns: minmax(0,1fr);
    grid-template-rows: minmax(0,1fr) auto calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 0px));
    grid-template-areas: "main" "mini-player" "bottom-nav";
    gap:0;padding:0;
  }
  #topbar,#sidebar,#right-panel,#player-bar,.resizer{display:none}
  #main{border-radius:0}
  #mini-player{grid-area:mini-player;display:block;position:relative;z-index:20;min-width:0}
  #bottom-nav{grid-area:bottom-nav;display:flex;position:relative;z-index:20;min-width:0;background:var(--bg-base);padding-bottom:env(safe-area-inset-bottom, 0px)}
  #expanded-player{display:flex;position:fixed;inset:0;z-index:30;overflow-y:auto}
}

/* ---------- 4. Scrollbars (SPEC §2) -------------------------------------- */
#sidebar,#main,#right-panel,#expanded-player,.context-menu{scrollbar-width:thin;scrollbar-color:transparent transparent}
#sidebar:hover,#main:hover,#right-panel:hover,#expanded-player:hover,.context-menu:hover{scrollbar-color:rgba(255,255,255,.3) transparent}
#sidebar::-webkit-scrollbar,#main::-webkit-scrollbar,#right-panel::-webkit-scrollbar,#expanded-player::-webkit-scrollbar,.context-menu::-webkit-scrollbar{width:12px}
#sidebar::-webkit-scrollbar-track,#main::-webkit-scrollbar-track,#right-panel::-webkit-scrollbar-track,#expanded-player::-webkit-scrollbar-track,.context-menu::-webkit-scrollbar-track{background:transparent}
#sidebar::-webkit-scrollbar-thumb,#main::-webkit-scrollbar-thumb,#right-panel::-webkit-scrollbar-thumb,#expanded-player::-webkit-scrollbar-thumb,.context-menu::-webkit-scrollbar-thumb{background:transparent;border:3px solid transparent;background-clip:content-box;border-radius:6px}
#sidebar:hover::-webkit-scrollbar-thumb,#main:hover::-webkit-scrollbar-thumb,#right-panel:hover::-webkit-scrollbar-thumb,#expanded-player:hover::-webkit-scrollbar-thumb,.context-menu:hover::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,.3)}

/* ---------- 5. Primitives (SPEC §3) -------------------------------------- */
.icon{width:24px;height:24px;fill:currentColor;flex:none;pointer-events:none}
.icon--sm{width:16px;height:16px}
.icon--lg{width:32px;height:32px}
.icon--xs{width:12px;height:12px}

.icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;color:var(--fg-sub);flex:none;transition:color .15s,transform .15s}
.icon-btn:hover,.icon-btn:focus-visible{color:var(--fg)}
.icon-btn:active{color:var(--fg-sub);transform:scale(.96)}
.icon-btn.is-active,.icon-btn.is-active:hover{color:var(--accent)}
.icon-btn:disabled,.icon-btn.is-disabled{color:var(--fg-muted);pointer-events:none}
.icon-btn--dot.is-active::after{content:"";position:absolute;left:50%;bottom:1px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.icon-btn--lg{width:40px;height:40px}
.icon-btn--round{background:var(--bg-elevated)}
.icon-btn--round:hover{background:var(--bg-highlight)}

.play-btn{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--on-accent);flex:none;transition:transform .15s,background-color .15s,opacity .3s}
.play-btn:hover,.play-btn:focus-visible{background:var(--accent-hover);transform:scale(1.04)}
.play-btn:active{background:var(--accent-press);transform:scale(1)}
.play-btn:disabled,.play-btn.is-disabled{background:var(--fg-muted);color:var(--on-accent);transform:none;cursor:default}
.play-btn--lg{width:56px;height:56px}
.play-btn--xl{width:64px;height:64px}
.play-btn--xl .icon{width:32px;height:32px}
.play-btn--white{width:32px;height:32px;background:var(--fg);color:var(--on-accent)}
.play-btn--white:hover,.play-btn--white:focus-visible,.play-btn--white:active{background:var(--fg)}
.play-btn--white.play-btn--xl{width:64px;height:64px}
.play-btn--white .icon{width:20px;height:20px}
.play-btn--white.play-btn--xl .icon{width:32px;height:32px}

.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:32px;padding:4px 16px;border:1px solid var(--border);border-radius:var(--radius-pill);font-size:14px;font-weight:700;line-height:1.4;color:var(--fg);background:transparent;white-space:nowrap;transition:transform .1s,border-color .15s,background-color .15s}
.pill:hover,.pill:focus-visible{border-color:var(--fg);transform:scale(1.04)}
.pill:active{transform:scale(1);opacity:.8}
.pill--primary{background:var(--fg);color:var(--on-accent);border-color:var(--fg)}
.pill--primary:hover{background:var(--fg)}
.pill--outline{border-color:var(--fg-muted)}
.pill--sm{font-size:12px;min-height:24px;padding:2px 12px}
.pill:disabled{color:var(--fg-muted);border-color:var(--border);transform:none}

.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--radius-pill);font-size:14px;font-weight:500;line-height:1;color:var(--fg);background:var(--bg-tinted-strong);white-space:nowrap;flex:none;transition:background-color .15s}
.chip:hover{background:rgba(255,255,255,.15)}
.chip[aria-pressed="true"],.chip.is-active{background:var(--fg);color:var(--on-accent)}
.chip--icon{width:32px;padding:0}

.cover{border-radius:var(--radius-card);object-fit:cover;flex:none;background:var(--bg-menu);display:block}
.cover--round{border-radius:50%}
.cover--24{width:24px;height:24px;border-radius:50%}
.cover--32{width:32px;height:32px;border-radius:4px}
.cover--40{width:40px;height:40px;border-radius:4px}
.cover--48{width:48px;height:48px;border-radius:4px}
.cover--56{width:56px;height:56px;border-radius:4px}
.cover--64{width:64px;height:64px;border-radius:4px}
.cover--92{width:92px;height:92px}
.cover--round.cover--40,.cover--round.cover--48,.cover--round.cover--56,.cover--round.cover--64{border-radius:50%}

.equaliser{display:inline-flex;align-items:flex-end;justify-content:center;gap:2px;width:14px;height:14px;flex:none}
.equaliser i{display:block;width:3px;height:40%;border-radius:1px;background:var(--accent);animation:eq-bar .9s ease-in-out infinite alternate;transform-origin:bottom}
.equaliser i:nth-child(1){animation-delay:-.6s;height:60%}
.equaliser i:nth-child(2){animation-delay:-.2s;height:100%}
.equaliser i:nth-child(3){animation-delay:-.45s;height:30%}
@keyframes eq-bar{0%{transform:scaleY(.3)}50%{transform:scaleY(1)}100%{transform:scaleY(.55)}}

.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}

.truncate{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.tabular{font-variant-numeric:tabular-nums}
.text-link{font-size:14px;font-weight:700;color:var(--fg-sub);white-space:nowrap}
.text-link:hover,.text-link:focus-visible{color:var(--fg);text-decoration:underline}
.link:hover,.link:focus-visible{text-decoration:underline;color:var(--fg)}
.text-btn{font-size:14px;font-weight:700;color:var(--fg);padding:8px;transition:transform .1s}
.text-btn:hover{transform:scale(1.04)}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--avatar-bg);color:var(--on-accent);font-size:14px;font-weight:700;flex:none;line-height:1}
.avatar--24{width:24px;height:24px;font-size:11px}
.badge-e{color:var(--fg-sub);flex:none}
.badge-verified{color:var(--verified);flex:none}


/* ---- player.css ---- */
/* player.css — owner: player agent.
   Everything inside #player-bar, #mini-player and #expanded-player (SPEC §3 CSS ownership), including .slider.
   The file is self-contained: it relies only on the styles.css tokens and primitives (.icon, .icon-btn, .play-btn,
   .cover, .eyebrow). Part 0 holds the class-level component defaults (moved here from styles.css); every later
   rule is scoped to the three containers and overrides them. Grid placement, size and the per-breakpoint
   hiding of the containers themselves stay in styles.css: no rule here sets `display` on a container except
   inside the breakpoint where styles.css shows it. Colours come from tokens (rgba shadows/overlays excepted). */

/* ---------- 0. Component defaults (moved here from styles.css; class selectors, overridden by the
   container-scoped rules below) ---------- */
/* Sliders (range inputs). player.js sets --fill as a percentage. */
.slider{-webkit-appearance:none;appearance:none;display:block;width:100%;height:16px;margin:0;padding:0;background:transparent;cursor:pointer;--_track:linear-gradient(to right,var(--fg) var(--fill,0%),var(--bg-tinted-strong) 0)}
.slider:hover,.slider:focus-visible,.slider:active{--_track:linear-gradient(to right,var(--accent) var(--fill,0%),var(--bg-tinted-strong) 0)}
.slider:focus-visible{box-shadow:none}
.slider::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--_track)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;margin-top:-4px;border:0;border-radius:50%;background:var(--fg);box-shadow:0 2px 4px rgba(0,0,0,.5);opacity:0;transition:opacity .1s}
.slider:hover::-webkit-slider-thumb,.slider:focus-visible::-webkit-slider-thumb,.slider:active::-webkit-slider-thumb,.slider--thumb::-webkit-slider-thumb{opacity:1}
.slider::-moz-range-track{height:4px;border-radius:2px;background:var(--_track)}
.slider::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--fg);box-shadow:0 2px 4px rgba(0,0,0,.5);opacity:0;transition:opacity .1s}
.slider:hover::-moz-range-thumb,.slider:focus-visible::-moz-range-thumb,.slider:active::-moz-range-thumb,.slider--thumb::-moz-range-thumb{opacity:1}
.slider:disabled{cursor:default;opacity:.5}
.slider--volume{width:93px}
.slider--thumb{--_track:linear-gradient(to right,var(--fg) var(--fill,0%),var(--bg-tinted-strong) 0)}
.slider--thumb:hover{--_track:linear-gradient(to right,var(--fg) var(--fill,0%),var(--bg-tinted-strong) 0)}
/* Player bar (desktop/tablet) */
.player-bar{display:grid;grid-template-columns:30% 40% 30%;align-items:center;padding:0 8px;min-width:0}
.player-bar > *{min-width:0}
.pb-left{display:flex;align-items:center;gap:8px;min-width:0;padding-left:8px}
.pb-cover{position:relative;width:56px;height:56px;flex:none;border-radius:4px;background:var(--bg-menu)}
.pb-cover .cover{width:56px;height:56px;border-radius:4px}
.pb-cover__expand{position:absolute;top:4px;right:4px;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--bg-elevated);color:var(--fg-sub);opacity:0;transition:opacity .15s,color .15s}
.pb-cover__expand .icon{width:16px;height:16px}
.pb-cover:hover .pb-cover__expand,.pb-cover__expand:focus-visible{opacity:1}
.pb-cover__expand:hover{color:var(--fg);transform:scale(1.06)}
.pb-text{display:flex;flex-direction:column;gap:2px;min-width:0;margin:0 8px 0 6px}
.pb-title{font-size:14px;color:var(--fg);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pb-title a:hover{text-decoration:underline}
.pb-artist{font-size:11px;color:var(--fg-sub);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pb-artist a:hover{color:var(--fg);text-decoration:underline}
.pb-center{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:722px;justify-self:center;min-width:0}
.pb-controls{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.pb-progress{display:flex;align-items:center;gap:8px;width:100%;min-width:0}
.pb-time{min-width:40px;font-size:11px;color:var(--fg-sub);font-variant-numeric:tabular-nums;text-align:right;flex:none}
.pb-time--total{text-align:left}
.pb-progress .slider{flex:1 1 auto;min-width:0}
.pb-right{display:flex;align-items:center;justify-content:flex-end;gap:0;min-width:0;padding-right:8px}
.pb-volume{display:flex;align-items:center;gap:4px;min-width:0}
.player-bar.is-empty .pb-left{visibility:hidden}
.mini-player{position:relative;height:var(--mini-player-h);margin:0 8px 8px;border-radius:8px;background:var(--mini-color, var(--bg-menu));color:var(--fg);overflow:hidden;cursor:pointer;touch-action:pan-y}
.mini-player__inner{display:flex;align-items:center;gap:8px;height:100%;padding:8px}
.mini-player__text{display:flex;flex-direction:column;flex:1 1 auto;min-width:0;gap:1px}
.mini-player__title{font-size:14px;font-weight:700;line-height:1.3}
.mini-player__artist{font-size:12px;color:var(--fg-sub);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mini-player .icon-btn{color:var(--fg);width:40px;height:40px}
.mini-player__progress{position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:1px;background:rgba(255,255,255,.3)}
.mini-player__progress i{display:block;height:100%;width:var(--fill,0%);border-radius:1px;background:var(--fg)}
.marquee{overflow:hidden;white-space:nowrap;min-width:0}
.marquee__inner{display:inline-block;white-space:nowrap}
.marquee.is-scrolling .marquee__inner{animation:marquee 12s linear infinite;padding-right:32px}
.marquee.is-scrolling .marquee__inner span{padding-right:32px}
@keyframes marquee{0%,10%{transform:translateX(0)}90%,100%{transform:translateX(-50%)}}
.expanded-player{flex-direction:column;gap:16px;padding:16px 24px calc(24px + env(safe-area-inset-bottom, 0px));padding-top:calc(16px + env(safe-area-inset-top, 0px));background:linear-gradient(var(--xp-color, var(--bg-menu)) 0,var(--bg-panel) 70%);color:var(--fg);min-width:0}
.xp__top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.xp__top .icon-btn{color:var(--fg);width:40px;height:40px}
.xp__context{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:0;text-align:center}
.xp__context .eyebrow{font-size:11px;color:var(--fg)}
.xp__context-name{font-size:13px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%}
.xp__cover{width:min(88vw, calc(100vh - 400px));max-width:100%;aspect-ratio:1/1;align-self:center;margin:auto 0;border-radius:8px;box-shadow:var(--shadow-cover);transition:transform .2s}
.xp__cover .cover{width:100%;height:100%;border-radius:inherit}
.xp__cover.is-slide-left{transform:translateX(-30px);opacity:0}
.xp__cover.is-slide-right{transform:translateX(30px);opacity:0}
.xp__title-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-width:0}
.xp__text{display:flex;flex-direction:column;gap:2px;min-width:0}
.xp__title{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.xp__artist{font-size:16px;color:var(--fg-sub);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.xp__title-row .icon-btn{color:var(--fg)}
.xp__progress{display:flex;flex-direction:column;gap:4px;min-width:0}
.xp__times{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-sub);font-variant-numeric:tabular-nums}
.xp__controls{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.xp__controls .icon-btn{width:48px;height:48px;color:var(--fg)}
.xp__controls .icon-btn .icon{width:28px;height:28px}
.xp__controls .icon-btn.is-active{color:var(--accent)}
.xp__bottom{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.xp__bottom .icon-btn{color:var(--fg)}
@media (min-width: 768px) and (max-width: 1023px){
  .player-bar{grid-template-columns:30% 40% 30%}
}

/* ---------- 1. Sliders (range inputs). player.js sets --fill as a percentage on every value change ---------- */
#player-bar .slider,
#expanded-player .slider {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  width: 100%;
  height: 16px;
  margin: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
  touch-action: none;
  --slider-fill: var(--fg);
}
#player-bar .slider:hover,
#player-bar .slider:focus-visible,
#player-bar .slider:active { --slider-fill: var(--accent); }
#player-bar .slider:focus-visible,
#expanded-player .slider:focus-visible { outline: none; box-shadow: none; }
#player-bar .slider:disabled,
#expanded-player .slider:disabled { cursor: default; --slider-fill: var(--fg); }

/* track: 4px, white fill up to --fill on a tinted rail (accent fill on hover/focus in the bar) */
#player-bar .slider::-webkit-slider-runnable-track,
#expanded-player .slider::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 2px;
  background: linear-gradient(to right, var(--slider-fill) var(--fill, 0%), var(--bg-tinted-strong) 0);
}
#player-bar .slider::-moz-range-track,
#expanded-player .slider::-moz-range-track {
  height: 4px;
  border-radius: 2px;
  background: linear-gradient(to right, var(--slider-fill) var(--fill, 0%), var(--bg-tinted-strong) 0);
}

/* thumb: 12px white, visible on hover / focus / drag (always in the expanded player) */
#player-bar .slider::-webkit-slider-thumb,
#expanded-player .slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  margin-top: -4px;
  border: 0;
  border-radius: 50%;
  background: var(--fg);
  box-shadow: 0 2px 4px rgba(0,0,0,.5);
  opacity: 0;
  transition: opacity .1s;
}
#player-bar .slider::-moz-range-thumb,
#expanded-player .slider::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border: 0;
  border-radius: 50%;
  background: var(--fg);
  box-shadow: 0 2px 4px rgba(0,0,0,.5);
  opacity: 0;
  transition: opacity .1s;
}
#player-bar .slider:hover::-webkit-slider-thumb,
#player-bar .slider:focus-visible::-webkit-slider-thumb,
#player-bar .slider:active::-webkit-slider-thumb,
#expanded-player .slider--thumb::-webkit-slider-thumb { opacity: 1; }
#player-bar .slider:hover::-moz-range-thumb,
#player-bar .slider:focus-visible::-moz-range-thumb,
#player-bar .slider:active::-moz-range-thumb,
#expanded-player .slider--thumb::-moz-range-thumb { opacity: 1; }
#player-bar .slider:disabled::-webkit-slider-thumb,
#expanded-player .slider:disabled::-webkit-slider-thumb { opacity: 0; }
#player-bar .slider:disabled::-moz-range-thumb,
#expanded-player .slider:disabled::-moz-range-thumb { opacity: 0; }

#player-bar .slider--volume { flex: none; width: 93px; }

/* ---------- 2. Player bar (desktop and tablet) ---------- */
@media (min-width: 768px) {
  #player-bar {
    display: grid;
    grid-template-columns: 30% 40% 30%;
    align-items: center;
    padding: 0 8px;
    color: var(--fg);
  }
}
#player-bar > * { min-width: 0; }

/* left: cover with the hover "Expand" button, title / artists, add-check circle */
#player-bar .pb-left {
  display: flex;
  align-items: center;
  min-width: 0;
  padding-left: 8px;
}
#player-bar.is-empty .pb-left { visibility: hidden; }
#player-bar .pb-cover {
  position: relative;
  flex: none;
  width: 56px;
  height: 56px;
  border-radius: 4px;
  background: var(--bg-menu);
}
#player-bar .pb-cover .cover {
  width: 56px;
  height: 56px;
  border-radius: 4px;
  background: var(--bg-menu);
  -webkit-user-drag: none;
}
#player-bar .pb-cover__expand {
  position: absolute;
  top: 4px;
  right: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--bg-elevated);
  color: var(--fg-sub);
  opacity: 0;
  transition: opacity .15s, color .15s, transform .15s;
}
#player-bar .pb-cover__expand .icon { width: 16px; height: 16px; pointer-events: none; }
#player-bar .pb-cover:hover .pb-cover__expand,
#player-bar .pb-cover__expand:focus-visible { opacity: 1; }
#player-bar .pb-cover__expand:hover { color: var(--fg); transform: scale(1.06); }
#player-bar.is-empty .pb-cover__expand { display: none; }

#player-bar .pb-text {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  min-width: 0;
  margin: 0 12px 0 14px;
}
#player-bar .pb-title,
#player-bar .pb-artist {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
#player-bar .pb-title { font-size: 14px; font-weight: 500; line-height: 1.4; color: var(--fg); }
#player-bar .pb-title a { color: var(--fg); }
#player-bar .pb-artist { font-size: 11px; line-height: 1.4; color: var(--fg-sub); }
#player-bar .pb-artist a { color: inherit; }
#player-bar .pb-title a:hover,
#player-bar .pb-title a:focus-visible,
#player-bar .pb-artist a:hover,
#player-bar .pb-artist a:focus-visible { color: var(--fg); text-decoration: underline; }
#player-bar .pb-like { flex: none; }
#player-bar .pb-like.is-active,
#player-bar .pb-like.is-active:hover { color: var(--accent); }

/* centre: transport controls above the progress row, max 722px wide */
#player-bar .pb-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-self: center;
  gap: 8px;
  width: 100%;
  max-width: 722px;
  min-width: 0;
}
#player-bar .pb-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 0;
}
#player-bar .pb-controls .play-btn { margin: 0 8px; }
#player-bar .pb-controls .play-btn:hover { transform: scale(1.04); }
#player-bar .pb-controls .play-btn:disabled { transform: none; }
#player-bar .pb-progress {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-width: 0;
}
#player-bar .pb-progress .slider { flex: 1 1 auto; min-width: 0; }
#player-bar .pb-time {
  flex: none;
  min-width: 40px;
  font-size: 12px;
  line-height: 1;
  color: var(--fg-sub);
  font-variant-numeric: tabular-nums;
  text-align: right;
}
#player-bar .pb-time--total { text-align: left; }

/* right: now-playing / queue toggles (.icon-btn--dot), volume button + 93px slider */
#player-bar .pb-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  min-width: 0;
  padding-right: 8px;
}
#player-bar .pb-volume {
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
}
#player-bar .pb-mute.is-muted { color: var(--fg-sub); }
#player-bar .pb-mute.is-muted:hover { color: var(--fg); }

/* tablet: keep the volume slider but let it shrink before the toggles overflow */
@media (min-width: 768px) and (max-width: 1023px) {
  #player-bar .pb-volume .slider--volume { width: auto; flex: 0 1 93px; min-width: 40px; }
  #player-bar .pb-volume { flex: 0 1 auto; }
  /* no right panel at tablet widths (styles.css hides it): drop the Now Playing toggles; the queue button opens the Queue page */
  #player-bar .pb-npv,
  #player-bar .pb-cover__expand { display: none; }
}

/* ---------- 3. Mini player (phone) ---------- */
#mini-player {
  height: var(--mini-player-h);
  margin: 0 8px 8px;
  border-radius: 8px;
  background: var(--mini-color, var(--bg-menu));
  color: var(--fg);
  overflow: hidden;
  cursor: pointer;
  touch-action: none;            /* swipes are handled with pointer events */
  user-select: none;
  -webkit-user-select: none;
  transition: background-color .3s;
}
#mini-player .mini-player__inner {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 100%;
  padding: 8px 4px 8px 8px;
  min-width: 0;
}
/* cover + title/artist: one transparent button that opens the expanded player */
#mini-player .mini-player__open {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  padding: 0;
  border-radius: 4px;
  text-align: left;
  color: inherit;
  background: none;
}
#mini-player .mini-player__title,
#mini-player .mini-player__artist { display: block; }
#mini-player .cover {
  flex: none;
  width: 40px;
  height: 40px;
  border-radius: 4px;
  -webkit-user-drag: none;
}
#mini-player .mini-player__text {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1px;
  flex: 1 1 auto;
  min-width: 0;
}
#mini-player .mini-player__title { font-size: 14px; font-weight: 700; line-height: 1.3; }
#mini-player .mini-player__artist {
  font-size: 12px;
  line-height: 1.3;
  color: var(--fg-sub);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
#mini-player .mini-player__artist:empty::before { content: "\00a0"; }
#mini-player .icon-btn { flex: none; width: 40px; height: 40px; color: var(--fg); }
#mini-player .icon-btn .icon { width: 24px; height: 24px; }
#mini-player .mp-like.is-active,
#mini-player .mp-like.is-active:hover { color: var(--accent); }
#mini-player .mini-player__progress {
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: 0;
  height: 2px;
  border-radius: 1px;
  background: rgba(255,255,255,.3);
  pointer-events: none;
}
#mini-player .mini-player__progress i {
  display: block;
  width: var(--fill, 0%);
  height: 100%;
  border-radius: 1px;
  background: var(--fg);
}

/* marquee: a title wider than its cell scrolls; player.js duplicates the text span and adds .is-scrolling.
   Each copy carries the same trailing gap, so translating by -50% lands exactly on the second copy. */
#mini-player .marquee { overflow: hidden; white-space: nowrap; min-width: 0; }
#mini-player .marquee__inner { display: inline-block; white-space: nowrap; will-change: transform; }
#mini-player .marquee.is-scrolling .marquee__inner > span { display: inline-block; padding-right: 32px; }
#mini-player .marquee.is-scrolling .marquee__inner { padding-right: 0; animation: wl-mini-marquee 12s linear 1s infinite; }
@keyframes wl-mini-marquee {
  0%, 12% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ---------- 4. Expanded player (phone full-screen now-playing view) ---------- */
@media (max-width: 767px) {
  #expanded-player {
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: fixed;
    inset: 0;
    z-index: 30;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to bottom, var(--xp-color, var(--bg-menu)) 0%, var(--bg-panel) 75%);
    background-color: var(--bg-panel);
    color: var(--fg);
    min-width: 0;
  }
}
#expanded-player .xp__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
  flex: none;
}
#expanded-player .xp__top .icon-btn { width: 40px; height: 40px; color: var(--fg); }
#expanded-player .xp__context {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  flex: 1 1 auto;
  min-width: 0;
  text-align: center;
}
#expanded-player .xp__context .eyebrow { font-size: 11px; color: var(--fg); }
#expanded-player .xp__context-name {
  max-width: 100%;
  font-size: 13px;
  font-weight: 700;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
#expanded-player .xp__cover {
  flex: none;
  align-self: center;
  width: min(88vw, max(160px, calc(100vh - 380px)));
  max-width: 100%;
  aspect-ratio: 1 / 1;
  margin: auto 0;
  border-radius: 8px;
  box-shadow: var(--shadow-cover);
  touch-action: none;            /* horizontal swipe = next / previous, swipe down = close */
  user-select: none;
  -webkit-user-select: none;
  transition: transform .2s ease, opacity .2s ease;
}
#expanded-player .xp__cover .cover {
  width: 100%;
  height: 100%;
  border-radius: inherit;
  -webkit-user-drag: none;
}
#expanded-player .xp__cover.is-slide-left { transform: translateX(-40px); opacity: 0; }
#expanded-player .xp__cover.is-slide-right { transform: translateX(40px); opacity: 0; }
#expanded-player .xp__cover.is-static { transition: none; }

#expanded-player .xp__title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-width: 0;
  flex: none;
}
#expanded-player .xp__text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
#expanded-player .xp__title {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -.02em;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
#expanded-player .xp__artist {
  font-size: 16px;
  color: var(--fg-sub);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
#expanded-player .xp__artist a { color: inherit; }
#expanded-player .xp__artist a:hover,
#expanded-player .xp__artist a:focus-visible { color: var(--fg); text-decoration: underline; }
#expanded-player .xp__title-row .icon-btn { flex: none; color: var(--fg); }
#expanded-player .xp-like.is-active,
#expanded-player .xp-like.is-active:hover { color: var(--accent); }

#expanded-player .xp__progress { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: none; }
#expanded-player .xp__progress .slider { height: 20px; }
#expanded-player .xp__times {
  display: flex;
  justify-content: space-between;
  padding: 0 2px;
  font-size: 12px;
  color: var(--fg-sub);
  font-variant-numeric: tabular-nums;
}

#expanded-player .xp__controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
  flex: none;
}
#expanded-player .xp__controls .icon-btn { width: 48px; height: 48px; color: var(--fg); }
#expanded-player .xp__controls .icon-btn .icon { width: 28px; height: 28px; }
#expanded-player .xp__controls .icon-btn.is-active,
#expanded-player .xp__controls .icon-btn.is-active:hover { color: var(--accent); }
#expanded-player .xp__controls .play-btn { width: 64px; height: 64px; background: var(--fg); color: var(--on-accent); }
#expanded-player .xp__controls .play-btn .icon { width: 32px; height: 32px; }

#expanded-player .xp__bottom { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex: none; }
#expanded-player .xp__bottom .icon-btn { width: 40px; height: 40px; color: var(--fg); }

/* ---------- 5. Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  #mini-player .marquee.is-scrolling .marquee__inner { animation: none; transform: none; }
  #expanded-player .xp__cover { transition: none; }
  #expanded-player .xp__cover.is-slide-left,
  #expanded-player .xp__cover.is-slide-right { transform: none; opacity: 1; }
  #player-bar .pb-cover__expand { transition: none; }
}

/* ============================================================================
   Wavelength — app.css
   Owner: app agent. Everything rendered inside #topbar, #sidebar, #main,
   #right-panel, #bottom-nav, #context-menu, #dialog-root and #toast-root
   (SPEC §3 CSS ownership), on top of the styles.css tokens, grid and
   primitives. Part 1 is the component layer (formerly the "component
   defaults" section of styles.css); part 2 holds the later refinements.
   ========================================================================== */

/* ======================= 1. Components ======================= */

/* Top bar */
.topbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,586px) minmax(0,1fr);align-items:center;gap:8px;padding:0 16px 0 24px}
.topbar__left,.topbar__right{display:flex;align-items:center;gap:8px;min-width:0}
.topbar__right{justify-content:flex-end}
.topbar__logo{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;color:var(--fg);border-radius:50%}
.topbar__logo .icon{width:32px;height:32px}
.topbar__center{display:flex;align-items:center;gap:8px;width:min(100%, 586px);justify-self:center;min-width:0}
.round-btn{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--bg-elevated);color:var(--fg-sub);flex:none;transition:transform .15s,color .15s}
.round-btn:hover,.round-btn:focus-visible{color:var(--fg);transform:scale(1.04)}
.round-btn.is-active{color:var(--fg)}
.search-pill{position:relative;display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;max-width:474px;height:48px;padding:0 8px 0 12px;border:1px solid transparent;border-radius:var(--radius-pill);background:var(--bg-elevated);color:var(--fg-sub);transition:background-color .15s,border-color .15s}
.search-pill:hover{background:var(--bg-highlight);border-color:var(--fg-muted);color:var(--fg)}
.search-pill:focus-within{background:var(--bg-highlight);border-color:transparent;box-shadow:inset 0 0 0 2px var(--fg);color:var(--fg)}
.search-pill__input{flex:1 1 auto;min-width:0;height:100%;border:0;background:none;color:var(--fg);font-size:14px;font-weight:500;outline:none}
.search-pill__input:focus-visible{box-shadow:none}
.search-pill__divider{width:1px;height:24px;background:var(--fg-sub);flex:none;margin:0 4px}
.search-pill__clear{color:var(--fg-sub)}
.search-pill__clear:hover{color:var(--fg)}
.search-pill__browse{color:var(--fg-sub)}
.search-pill__browse:hover,.search-pill__browse.is-active{color:var(--fg)}
.avatar-btn{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--bg-elevated);flex:none;transition:transform .15s}
.avatar-btn:hover,.avatar-btn:focus-visible{transform:scale(1.04)}
/* Library panel */
.sidebar{display:flex;flex-direction:column}
.lib-header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:var(--rail-just, space-between);gap:8px;padding:8px 16px 8px 16px;background:var(--bg-panel);flex-direction:var(--rail-dir, row)}
.lib-title{display:flex;align-items:center;gap:12px;height:40px;padding:4px 8px;border-radius:4px;font-size:16px;font-weight:700;color:var(--fg-sub);min-width:0;transition:color .15s}
.lib-title:hover,.lib-title:focus-visible{color:var(--fg)}
.lib-title span{display:var(--rail-hide, inline);white-space:nowrap}
.lib-header .icon-btn{display:var(--rail-hide, inline-flex)}
.lib-header .lib-add{display:inline-flex}
.lib-chips{display:var(--rail-hide, flex);flex-wrap:wrap;gap:8px;padding:0 16px 8px}
.lib-filter{display:var(--rail-hide, flex);align-items:center;justify-content:space-between;gap:8px;padding:4px 16px 8px;min-height:40px}
.lib-filter__input{display:flex;align-items:center;gap:8px;height:32px;width:0;padding:0;border-radius:4px;background:var(--bg-tinted-strong);overflow:hidden;transition:width .2s}
.lib-filter__input.is-open{width:190px;padding:0 8px}
.lib-filter__input input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font-size:13px;outline:none}
.lib-filter__input input:focus-visible{box-shadow:none}
.lib-sort{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 4px;font-size:14px;font-weight:400;color:var(--fg-sub);white-space:nowrap}
.lib-sort:hover,.lib-sort:focus-visible{color:var(--fg);transform:scale(1.02)}
.lib-list{display:flex;flex-direction:column;gap:0;padding:0 8px 8px}
.lib-row{position:relative;display:grid;grid-template-columns:var(--rail-cols, 48px minmax(0,1fr) auto);align-items:center;gap:12px;padding:var(--rail-pad, 8px);border-radius:var(--radius-card);color:var(--fg-sub);cursor:pointer;min-width:0;text-align:left;width:100%;justify-content:var(--rail-just, start)}
.lib-row:hover,.lib-row:focus-within{background:var(--bg-tinted)}
.lib-row:active{background:var(--bg-tinted-press)}
.lib-row.is-active{background:var(--bg-tinted-strong)}
.lib-row.is-active:hover{background:rgba(255,255,255,.15)}
.lib-row__cover{position:relative;width:48px;height:48px;flex:none}
.lib-row__cover .cover{width:48px;height:48px}
.lib-row__play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:inherit;background:var(--overlay);color:var(--fg);opacity:0;transition:opacity .15s}
.lib-row__cover--round .lib-row__play{border-radius:50%}
.lib-row:hover .lib-row__play,.lib-row__play:focus-visible,.lib-row.is-playing .lib-row__play{opacity:1}
.lib-row.is-playing .lib-row__play{opacity:0}
.lib-row.is-playing:hover .lib-row__play{opacity:1}
.lib-row__text{display:var(--rail-hide, flex);flex-direction:column;gap:2px;min-width:0}
.lib-row .name{font-size:16px;font-weight:400;color:var(--fg);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lib-row.is-current .name{color:var(--accent)}
.lib-row .sub{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--fg-sub);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lib-row .sub .icon{color:var(--accent)}
.lib-row__end{display:var(--rail-hide, flex);align-items:center;gap:8px;color:var(--accent);padding-right:4px}
.lib-row__speaker{display:none}
.lib-row.is-playing .lib-row__speaker{display:block}
.lib-row__more{position:absolute;right:8px;top:50%;transform:translateY(-50%);opacity:0;color:var(--fg-sub);display:var(--rail-hide, inline-flex)}
.lib-row:hover .lib-row__more,.lib-row__more:focus-visible,.lib-row:focus-within .lib-row__more{opacity:1}
.lib-row.is-playing .lib-row__more{display:none}
.lib-empty{display:var(--rail-hide, block);padding:24px 16px;color:var(--fg-sub);font-size:14px}
.lib-empty strong{display:block;color:var(--fg);font-size:16px;font-weight:700;margin-bottom:8px}
/* Main panel: sticky strip, gradient heads, page padding */
.main-header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;height:var(--topbar-h);padding:0 24px;isolation:isolate}
.main-header::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--strip-tint, var(--bg-panel));opacity:var(--strip-opacity, 0);transition:opacity .15s}
.main-header__nav{display:flex;align-items:center;gap:8px;flex:none}
.nav-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.7);color:var(--fg);flex:none}
.nav-btn:hover,.nav-btn:focus-visible{color:var(--fg)}
.nav-btn:disabled{color:var(--fg-muted)}
.main-header__ctx{display:flex;align-items:center;gap:8px;min-width:0;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .2s,transform .2s,visibility 0s .2s}
.main-header__ctx.is-visible{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .2s}
.main-header__title{font-size:24px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.main-header__end{margin-left:auto;display:flex;align-items:center;gap:8px}
.home-head{position:absolute;left:0;right:0;top:0;z-index:-1;height:300px;background-color:var(--home-tint, var(--bg-elevated));-webkit-mask-image:linear-gradient(var(--bg-base), transparent);mask-image:linear-gradient(var(--bg-base), transparent);transition:background-color 1s;pointer-events:none}
.page{position:relative;padding:0 24px 32px;min-width:0}
.page--hero{padding-top:0}
.page-title{font-size:24px;font-weight:700;margin:8px 0 16px}
.page-title--lg{font-size:32px}
.section-title{font-size:24px;font-weight:700;letter-spacing:-.01em}
.section-sub{font-size:14px;color:var(--fg-sub)}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.chips--home{padding-top:8px}
.chips .avatar{margin-right:8px}
/* Home: quick tiles, shelves, cards */
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0 24px}
@container (max-width: 860px){.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.quick-tile{position:relative;display:flex;align-items:center;gap:12px;height:48px;min-width:0;padding-right:8px;border-radius:4px;background:var(--bg-tinted-strong);overflow:hidden;cursor:pointer;text-align:left;color:var(--fg);transition:background-color .3s}
.quick-tile:hover,.quick-tile:focus-within{background:var(--tile-hover)}
.quick-tile .cover{width:48px;height:48px;border-radius:4px 0 0 4px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.quick-tile__name{flex:1;min-width:0;font-size:16px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:48px}
.quick-tile .play-btn{position:absolute;right:8px;top:0;bottom:0;margin:auto 0;opacity:0;transform:translateY(0);box-shadow:0 8px 8px rgba(0,0,0,.3)}
.quick-tile:hover .play-btn,.quick-tile:focus-within .play-btn,.quick-tile.is-playing .play-btn{opacity:1}
.quick-tile.is-current .quick-tile__name{color:var(--accent)}
.shelf{margin:0 0 24px;min-width:0}
.shelf__head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:0 12px;margin-bottom:8px;min-width:0}
.shelf__title{font-size:24px;font-weight:700;letter-spacing:-.01em;color:var(--fg);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
a.shelf__title:hover,button.shelf__title:hover{text-decoration:underline}
.shelf__all{font-size:14px;font-weight:700;color:var(--fg-sub);white-space:nowrap;flex:none}
.shelf__all:hover,.shelf__all:focus-visible{color:var(--fg);text-decoration:underline}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0;min-width:0}
.card-grid--row{grid-template-rows:auto;grid-auto-rows:0;row-gap:0;overflow:hidden}
.card{position:relative;display:flex;flex-direction:column;gap:8px;width:100%;min-width:0;padding:12px;border-radius:var(--radius-card);background:transparent;text-align:left;color:var(--fg);cursor:pointer;transition:background-color .3s}
.card:hover,.card:focus-within{background:var(--bg-tinted)}
.card:active{background:var(--bg-tinted-press)}
.card__cover{position:relative;width:100%;aspect-ratio:1/1;border-radius:var(--radius-card);box-shadow:var(--shadow-cover)}
.card__cover .cover{width:100%;height:100%;border-radius:inherit}
.card--round .card__cover{border-radius:50%}
.card--round .card__cover .cover{border-radius:50%}
.card .play-btn{position:absolute;right:8px;bottom:8px;opacity:0;transform:translateY(8px);box-shadow:0 8px 8px rgba(0,0,0,.3);transition:opacity .3s,transform .3s,background-color .15s}
.card:hover .play-btn,.card:focus-within .play-btn,.card.is-playing .play-btn{opacity:1;transform:translateY(0)}
.card .play-btn:hover{transform:translateY(0) scale(1.04)}
.card__text{display:flex;flex-direction:column;gap:4px;min-width:0;padding-bottom:4px}
.card__title{font-size:16px;font-weight:700;line-height:1.4;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card__sub{font-size:14px;color:var(--fg-sub);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card.is-current .card__title{color:var(--accent)}
.card__close{position:absolute;top:16px;right:16px;z-index:1;width:24px;height:24px;border-radius:50%;background:var(--bg-panel);color:var(--fg-sub);display:inline-flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.card:hover .card__close,.card__close:focus-visible{opacity:1}
.card__close:hover{color:var(--fg);transform:scale(1.04)}
/* Browse cards, top result, compact song rows */
.browse-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:24px;min-width:0}
.browse-card{position:relative;display:block;width:100%;aspect-ratio:1/1;padding:16px;border-radius:8px;overflow:hidden;background:var(--browse-color, var(--bg-menu));color:var(--fg);font-size:24px;font-weight:700;line-height:1.2;letter-spacing:-.01em;text-align:left;cursor:pointer;overflow-wrap:anywhere;transition:transform .15s}
.browse-card:hover{transform:scale(1.02)}
.browse-card .cover{position:absolute;right:-18px;bottom:-8px;width:100px;height:100px;border-radius:4px;transform:rotate(25deg);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.search-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:24px;align-items:stretch;margin-bottom:32px;min-width:0}
.search-col__title{font-size:24px;font-weight:700;margin-bottom:16px}
.top-result{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:20px;min-height:232px;padding:20px;border-radius:8px;background:var(--bg-elevated);color:var(--fg);text-align:left;cursor:pointer;min-width:0;transition:background-color .3s}
.top-result:hover,.top-result:focus-within{background:var(--bg-menu)}
.top-result .cover{width:92px;height:92px;box-shadow:var(--shadow-cover)}
.top-result__name{font-size:32px;font-weight:700;line-height:1.1;letter-spacing:-.02em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.top-result.is-current .top-result__name{color:var(--accent)}
.top-result__meta{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg-sub);min-width:0;flex-wrap:wrap}
.top-result__meta a:hover{color:var(--fg);text-decoration:underline}
.type-pill{display:inline-flex;align-items:center;padding:4px 12px;border-radius:var(--radius-pill);background:var(--bg-panel);color:var(--fg);font-size:14px;font-weight:700;line-height:1.4}
.top-result .play-btn{position:absolute;right:20px;bottom:20px;opacity:0;transform:translateY(8px);box-shadow:0 8px 8px rgba(0,0,0,.3);transition:opacity .3s,transform .3s}
.top-result:hover .play-btn,.top-result:focus-within .play-btn,.top-result.is-playing .play-btn{opacity:1;transform:translateY(0)}
.song-list{display:flex;flex-direction:column;min-width:0}
.song-row{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;height:56px;padding:8px;border-radius:4px;color:var(--fg-sub);font-size:14px;min-width:0;cursor:default}
.song-row:hover,.song-row:focus-within,.song-row.is-selected{background:var(--bg-tinted)}
.song-row.is-selected{background:var(--selected)}
.song-row__cover{position:relative;width:40px;height:40px}
.song-row__cover .cover{width:40px;height:40px}
.song-row__play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:inherit;background:var(--overlay);color:var(--fg);opacity:0;transition:opacity .15s}
.song-row:hover .song-row__play,.song-row:focus-within .song-row__play,.song-row.is-playing .song-row__play{opacity:1}
.song-row__text{display:flex;flex-direction:column;min-width:0;gap:2px}
.song-row__title{font-size:16px;color:var(--fg);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.song-row.is-current .song-row__title{color:var(--accent)}
.song-row__artist{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--fg-sub);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.song-row__artist a:hover,.song-row__album a:hover{color:var(--fg);text-decoration:underline}
.song-row__end{display:flex;align-items:center;justify-content:flex-end;gap:16px}
.song-row__like,.song-row__more{visibility:hidden;color:var(--fg-sub)}
.song-row:hover .song-row__like,.song-row:hover .song-row__more,.song-row:focus-within .song-row__like,.song-row:focus-within .song-row__more,.song-row.is-selected .song-row__like,.song-row.is-selected .song-row__more{visibility:visible}
.song-row__like.is-liked{visibility:visible;color:var(--accent)}
.song-row__dur{min-width:4ch;text-align:right;font-variant-numeric:tabular-nums}
/* Hero + action bar */
.hero{position:relative;display:flex;align-items:flex-end;gap:24px;min-height:340px;padding:0 24px 24px;margin:calc(-1 * var(--topbar-h)) -24px 0;padding-top:var(--topbar-h);background:linear-gradient(transparent 0,rgba(0,0,0,.5) 100%),var(--hero-color, var(--bg-elevated));min-width:0;color:var(--fg)}
.hero--genre{min-height:0;height:260px;align-items:flex-end;background:var(--hero-color, var(--bg-menu))}
.hero--liked{--hero-color: var(--liked-hero)}
.hero__cover{position:relative;width:232px;height:232px;flex:none;border-radius:4px;box-shadow:var(--shadow-cover);background:var(--bg-menu)}
.hero__cover .cover{width:100%;height:100%;border-radius:inherit}
.hero__cover--round,.hero__cover--round .cover{border-radius:50%}
.hero__cover-edit{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:inherit;background:var(--bg-menu);color:var(--fg);font-size:16px;font-weight:700;opacity:0;cursor:pointer;transition:opacity .15s}
.hero__cover-edit .icon{width:48px;height:48px}
.hero--editable .hero__cover:hover .hero__cover-edit,.hero--editable .hero__cover:focus-visible .hero__cover-edit{opacity:.9}
.hero--editable .hero__title,.hero--editable .hero__desc{cursor:pointer}
.hero__info{display:flex;flex-direction:column;justify-content:flex-end;gap:8px;min-width:0;flex:1 1 auto}
.hero__type{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:400}
.hero__title{font-weight:900;letter-spacing:-.04em;line-height:1;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding:.08em 0 .12em;margin:0;font-size:48px;letter-spacing:-.02em}
.hero__title.title-96{font-size:96px;letter-spacing:-.04em}
.hero__title.title-72{font-size:72px;letter-spacing:-.04em}
.hero__title.title-48{font-size:48px;letter-spacing:-.02em}
.hero__title.title-32{font-size:32px;letter-spacing:-.02em}
/* narrow #main (both side panels open): step the hero title down */
@container (max-width: 820px){
  .hero__title.title-96{font-size:72px}
  .hero__title.title-72{font-size:56px}
}
@container (max-width: 640px){
  .hero__title.title-96,.hero__title.title-72{font-size:48px;letter-spacing:-.02em}
  .hero__cover{width:192px;height:192px}
}
.hero__desc{font-size:14px;color:var(--fg-sub);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero__meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:14px;color:var(--fg-sub);min-width:0}
.hero__meta b,.hero__meta a{color:var(--fg);font-weight:700}
.hero__meta a:hover{text-decoration:underline}
.hero__meta .avatar{margin-right:4px}
.hero__listeners{font-size:16px;color:var(--fg)}
.hero-band{position:absolute;left:0;right:0;height:232px;z-index:-1;background:linear-gradient(rgba(0,0,0,.6) 0,var(--bg-panel) 100%),var(--hero-color, var(--bg-elevated));background:linear-gradient(color-mix(in srgb, var(--hero-color, var(--bg-elevated)) 40%, var(--bg-base)) 0,var(--bg-panel) 100%);pointer-events:none}
/* the bar wraps when #main is narrow (both side panels open, an open inline filter): the right group then
   moves to its own line, still right-aligned, instead of overflowing #main and being clipped */
.actions{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:24px;row-gap:16px;padding:24px 0;min-width:0}
.actions__right{display:flex;align-items:center;gap:16px;margin-left:auto;min-width:0;max-width:100%}
.actions .icon-btn{width:32px;height:32px}
.actions .icon-btn .icon--lg{width:32px;height:32px}
.actions .pill{height:32px}
.inline-filter{display:flex;align-items:center;gap:8px;height:32px;width:0;padding:0;border-radius:4px;background:var(--bg-tinted-strong);color:var(--fg);overflow:hidden;transition:width .2s,padding .2s}
.inline-filter.is-open{width:min(200px,40cqi);padding:0 8px}
.inline-filter input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font-size:14px;outline:none}
.inline-filter input:focus-visible{box-shadow:none}
.inline-filter--open{width:200px;padding:0 8px}
.view-toggle{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 4px;font-size:14px;color:var(--fg-sub)}
.view-toggle:hover,.view-toggle:focus-visible{color:var(--fg)}
/* Track table */
.track-table{--row-cols:16px minmax(0,6fr) minmax(0,4fr) minmax(0,3fr) minmax(120px,1fr);display:block;min-width:0;margin-bottom:16px}
.track-table--album,.track-table--popular,.track-table--songs,.track-table--queue{--row-cols:16px minmax(0,6fr) minmax(0,4fr) minmax(120px,1fr)}
.track-table--compact{--row-cols:16px minmax(0,5fr) minmax(0,3fr) minmax(0,4fr) minmax(0,3fr) minmax(120px,1fr)}
.track-table--compact.track-table--album{--row-cols:16px minmax(0,5fr) minmax(0,3fr) minmax(0,4fr) minmax(120px,1fr)}
/* narrow #main: drop the Date added column like the tablet layout */
@container (max-width: 760px){
  .track-table{--row-cols:16px minmax(0,6fr) minmax(0,4fr) minmax(120px,1fr)}
  .track-table--compact{--row-cols:16px minmax(0,5fr) minmax(0,3fr) minmax(0,4fr) minmax(120px,1fr)}
  .track-row__date,.cell--date{display:none}
}
.track-table--compact .track-row__cover,.track-table--compact .track-row__artist{display:none}
.track-table--compact .track-row__artist-col{display:block}
.track-row__artist-col{display:none;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.track-table__head{position:sticky;top:var(--topbar-h);z-index:4;display:grid;grid-template-columns:var(--row-cols);align-items:center;gap:16px;height:36px;padding:0 16px;margin:0 0 16px;border-bottom:1px solid var(--border);color:var(--fg-sub);font-size:14px;font-weight:400}
.track-table__head.is-stuck{background:var(--bg-panel);border-bottom:1px solid var(--border);margin:0 -24px 16px;padding:0 40px}
.track-table__head .cell--index{text-align:center;font-size:16px}
.track-table__head .cell--dur{display:flex;justify-content:flex-end;padding-right:32px}
.track-table__head .cell{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.track-row{position:relative;display:grid;grid-template-columns:var(--row-cols);align-items:center;gap:16px;height:56px;padding:0 16px;border-radius:4px;color:var(--fg-sub);font-size:14px;min-width:0;cursor:default;user-select:none}
.track-row:hover,.track-row:focus-within{background:var(--bg-tinted)}
.track-row.is-selected,.track-row.is-selected:hover{background:var(--selected);color:var(--fg)}
.track-row.is-disabled{opacity:.5}
.track-row__index{position:relative;display:flex;align-items:center;justify-content:center;width:16px;height:16px;font-size:16px;font-variant-numeric:tabular-nums;color:var(--fg-sub)}
.track-row.is-current .track-row__index{color:var(--accent)}
.track-row__num,.track-row__index .equaliser,.track-row__play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.track-row__index .equaliser{display:none}
.track-row__play{display:none;color:var(--fg);width:16px;height:16px}
.track-row.is-playing .track-row__num{display:none}
.track-row.is-playing .track-row__index .equaliser{display:inline-flex}
.track-row:hover .track-row__num,.track-row:focus-within .track-row__num,.track-row:hover .track-row__index .equaliser,.track-row:focus-within .track-row__index .equaliser{display:none}
.track-row:hover .track-row__play,.track-row:focus-within .track-row__play{display:flex}
.track-row__main{display:flex;align-items:center;gap:12px;min-width:0}
.track-row__cover{width:40px;height:40px;flex:none}
.track-row__text{display:flex;flex-direction:column;gap:2px;min-width:0}
.track-row__title{font-size:16px;color:var(--fg);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.track-row.is-current .track-row__title{color:var(--accent)}
.track-row__artist{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--fg-sub);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.track-row__artist span,.track-row__artist a{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.track-row:hover .track-row__artist,.track-row.is-selected .track-row__artist{color:var(--fg)}
.track-row__artist a:hover,.track-row__album a:hover{text-decoration:underline;color:var(--fg)}
.track-row__album,.track-row__date,.track-row__plays{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px}
.track-row:hover .track-row__album{color:var(--fg)}
.track-row__date{font-variant-numeric:tabular-nums}
.track-row__end{display:flex;align-items:center;justify-content:flex-end;gap:16px;min-width:0}
.track-row__like,.track-row__more{visibility:hidden;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg-sub);flex:none;transition:color .15s,transform .1s}

(function () {

  const TAU = Math.PI * 2;

  // ---------------------------------------------------------------------------
  // Seeded randomness
  // ---------------------------------------------------------------------------
  function hashString(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {

      h = Math.imul(h, 16777619);
    }

    const max = Math.max(r, g, b), min = Math.min(r, g, b);

    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
