<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Study site: Physics, Biology, Chemistry, Math</title>
<style>
@property --a1{syntax:'<color>';inherits:true;initial-value:#736f72}
@property --a2{syntax:'<color>';inherits:true;initial-value:#c3baba}
@property --a3{syntax:'<color>';inherits:true;initial-value:#9a8f97}
@property --p{syntax:'<number>';inherits:true;initial-value:0}
:root{
  /* Layout: sticky glass tab bar and lesson rail above a 12-column grid of glass cards.
     Each card holds notes or one figure. Figures sit on an opaque inset surface (--fig). */
  color-scheme:light;
  /* page */
  --bg:#e9e3e6;--ink:#2b272a;--ink2:#5c565a;
  --glass:rgba(250,247,248,.46);--glass2:rgba(250,247,248,.55);--well:rgba(250,247,248,.62);
  --hair:rgba(115,111,114,.2);--spec:rgba(255,255,255,1);--spec2:rgba(255,255,255,.34);
  --shadow:rgba(115,111,114,.2);--grid:rgba(115,111,114,.14);
  --ok:#2b7a4b;--bad:#b4473e;--okb:rgba(70,160,105,.17);--badb:rgba(200,90,80,.14);
  --atm:80%;--atc:#000;--thumb:rgba(255,255,255,.86);
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.45,.45,1);
  --hi:#fff;--hov:rgba(255,255,255,.6);--sheen:rgba(255,255,255,.7);--knob:linear-gradient(#fff,#efeaec);--notebg:rgba(255,255,255,.5);
  --thumbbg:linear-gradient(var(--thumb),rgba(255,255,255,.62));--thumbrim:linear-gradient(160deg,#fff,rgba(255,255,255,.2) 45%,rgba(255,255,255,.7));
  --b1:66%;--b2:58%;--b3:24%;
  /* figures: surface, text, grid */
  --fig:#f6f3f4;--fig2:#ede8ea;--mute:#736f72;--gridc:#e2dcdf;--axis:#b2b2b2;--ol:rgba(115,111,114,.42);--tipbg:rgba(248,245,246,.92);
  /* chart series, in fixed order. Checked with the colour-blind and contrast tests on --fig */
  --s1:#3572b8;--s2:#cf6a3a;--s3:#2b9a7c;--s4:#b58720;--s5:#c96b93;--s6:#5c4fae;
  /* materials for the physics and chemistry drawings */
  --steel:#b3bac7;--steel2:#5f6775;--wood:#cfa877;--wood2:#a67d50;--brass:#c9a24a;--gl:#8fb3d9;--liq:#cfe2f5;--rubber:#3b3f48;
  /* tissues for the biology drawings */
  --t-nerve:#dcb04e;--t-nerve2:#b98b2c;--t-nerve0:#f1d795;--t-myelin:#f3ecda;--t-myelin2:#d9cfb6;--t-schwann:#8d76b8;--t-nuc:#6a5a9c;
  --t-skin:#ecc8a9;--t-skin2:#d8a886;--t-bone:#eadcc2;--t-bone2:#d5c19c;--t-muscle:#cb6a63;--t-muscle2:#a94f4b;
  --t-grey:#cdb9bb;--t-white:#f2ecdf;--t-cavity:#dfe8f0;--t-membrane:#b9786a;
  --t-sclera:#f0eee8;--t-choroid:#a5545a;--t-retina:#e0a23c;--t-iris:#4f8f7e;--t-cornea:#9dc6e6;--t-lens:#f6f0c9;--t-humour:#d5e9f5;--t-vitreous:#e3f0ee;
  --t-body:#dfe3ec;--t-organ:#c9837c;
  --e-semi:color-mix(in srgb,var(--s6) 58%,var(--fig));--e-vest:color-mix(in srgb,var(--s3) 58%,var(--fig));--e-coch:color-mix(in srgb,var(--s1) 58%,var(--fig));
  --b-front:#a9c1e2;--b-par:#ead29a;--b-occ:#e6b4c8;--b-temp:#a9d4c1;--b-cbl:#cdb8dd;--b-cc:#f6f1e4;--b-thal:#e9a77c;--b-hypo:#d87b9c;--b-pit:#b0584e;--b-mid:#6fb8a4;--b-pons:#6e98d2;--b-med:#8a7ccc;
}
/* dark mode, selected with the button in the header */
:root[data-mode="dark"]{color-scheme:dark;
  --bg:#1c1a1b;--ink:#e9e3e6;--ink2:rgba(233,227,230,.7);
  --glass:rgba(48,44,47,.6);--glass2:rgba(255,255,255,.055);--well:rgba(0,0,0,.26);
  --hair:rgba(255,255,255,.1);--spec:rgba(255,255,255,.2);--spec2:rgba(255,255,255,.04);
  --shadow:rgba(0,0,0,.45);--grid:rgba(255,255,255,.1);
  --ok:#6bb388;--bad:#dc8f87;--okb:rgba(107,179,136,.16);--badb:rgba(212,131,123,.16);
  --atm:55%;--atc:#fff;--thumb:rgba(255,255,255,.14);
  --hi:rgba(255,255,255,.09);--hov:rgba(255,255,255,.08);--sheen:rgba(255,255,255,.06);--knob:#c3baba;--notebg:rgba(255,255,255,.03);
  --thumbbg:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,.08));--thumbrim:linear-gradient(160deg,rgba(255,255,255,.3),transparent 45%,rgba(255,255,255,.08));
  --b1:24%;--b2:20%;--b3:13%;
  --fig:#221f21;--fig2:#2a2629;--mute:#9a8f97;--gridc:#332f32;--axis:#4f4a4d;--ol:rgba(233,227,230,.3);--tipbg:rgba(40,36,39,.92);
  --s1:#4f8fd6;--s2:#d2703f;--s3:#2f9f80;--s4:#b98a22;--s5:#cf6f97;--s6:#8679dc;
  --steel:#7d8594;--steel2:#444b58;--wood:#a98660;--wood2:#7f6142;--brass:#b08c3e;--gl:#6f93ba;--liq:#2b3f55;--rubber:#4b505c;
  --t-nerve:#caa046;--t-nerve2:#a67c29;--t-nerve0:#e0c279;--t-myelin:#d6cfbd;--t-myelin2:#b3aa93;--t-schwann:#8a76b3;--t-nuc:#5f5191;
  --t-skin:#cfae93;--t-skin2:#b88f72;--t-bone:#cbbfa8;--t-bone2:#b3a183;--t-muscle:#b55f59;--t-muscle2:#964844;
  --t-grey:#a8989a;--t-white:#d6d0c4;--t-cavity:#2a313b;--t-membrane:#a56c60;
  --t-sclera:#d2d0ca;--t-choroid:#96494f;--t-retina:#c98f33;--t-iris:#47806f;--t-cornea:#7fa9c9;--t-lens:#d8d2ae;--t-humour:#31475a;--t-vitreous:#27383a;
  --t-body:#2b303b;--t-organ:#a86c66;
  --b-front:#8fa8ca;--b-par:#cdb680;--b-occ:#c99aae;--b-temp:#8fb9a6;--b-cbl:#b09cc2;--b-cc:#d8d3c6;--b-thal:#cc8f66;--b-hypo:#bd6886;--b-pit:#994a42;--b-mid:#5c9f8d;--b-pons:#5d84ba;--b-med:#7669b3;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  --a1:#736f72;--a2:#c3baba;--a3:#9a8f97;
  --at:color-mix(in srgb,var(--a1) var(--atm),var(--atc));
  transition:--a1 .9s,--a2 .9s,--a3 .9s}
body[data-s="eq"]{--a1:#7a7078;--a2:#9a8f97;--a3:#c3baba}
body[data-s="ns"]{--a1:#6a6468;--a2:#b2b2b2;--a3:#9a8f97}
body[data-s="sn"]{--a1:#676366;--a2:#c3baba;--a3:#b2b2b2}
[data-mode="dark"] body{--a1:#736f72;--a2:#736f72;--a3:#9a8f97}
[data-mode="dark"] body[data-s="eq"]{--a1:#7a7078;--a2:#9a8f97;--a3:#736f72}
[data-mode="dark"] body[data-s="ns"]{--a1:#6a6468;--a2:#9a8f97;--a3:#b2b2b2}
[data-mode="dark"] body[data-s="sn"]{--a1:#676366;--a2:#736f72;--a3:#c3baba}
body[data-s="math"],body[data-s="home"]{--a1:#736f72;--a2:#b2b2b2;--a3:#c3baba}
[data-mode="dark"] body[data-s="math"],[data-mode="dark"] body[data-s="home"]{--a1:#736f72;--a2:#9a8f97;--a3:#736f72}

/* one gradient layer, moved with transform only */
.bg{position:fixed;inset:-16%;z-index:-1;pointer-events:none;will-change:transform;
  background:
    radial-gradient(38% 42% at 18% 22%,color-mix(in srgb,var(--a2) var(--b1),transparent),transparent 72%),
    radial-gradient(34% 40% at 84% 30%,color-mix(in srgb,var(--a3) var(--b2),transparent),transparent 72%),
    radial-gradient(46% 44% at 52% 88%,color-mix(in srgb,var(--a1) var(--b3),transparent),transparent 72%);
  animation:drift 46s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3%,-4%,0) rotate(5deg) scale(1.07)}}

.glass{
  background:linear-gradient(var(--glass),var(--glass)) padding-box,
    linear-gradient(145deg,var(--spec),var(--spec2) 32%,var(--spec2) 68%,var(--spec)) border-box;
  border:1px solid transparent;
  -webkit-backdrop-filter:blur(22px) saturate(165%);backdrop-filter:blur(22px) saturate(165%);
  box-shadow:inset 0 1px 1px var(--hi),inset 0 -1px 1px rgba(50,42,48,.03),0 14px 38px var(--shadow),0 2px 6px rgba(80,70,77,.06);
}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:12px 12px 0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.top>*{pointer-events:auto;transition:box-shadow .4s var(--ease),background .4s}
.top.scrolled>.glass{box-shadow:inset 0 1px 1px var(--hi),0 18px 44px rgba(80,70,77,.22),0 2px 8px rgba(80,70,77,.1)}
.bar{border-radius:999px;padding:5px;max-width:100%;display:flex;align-items:center;gap:4px}
.modebtn{appearance:none;border:1px solid var(--hair);background:var(--glass2);color:var(--ink);width:36px;height:36px;border-radius:50%;padding:0;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:inset 0 1px 0 var(--hi);transition:transform .25s var(--spring)}
.modebtn:active{transform:scale(.9) rotate(20deg)}
.seg{position:relative;display:flex;border-radius:999px;isolation:isolate}
.seg.main button{display:flex;align-items:center;gap:.5em}
.seg button{appearance:none;border:0;background:none;color:var(--ink);font:inherit;font-weight:600;font-size:.94rem;padding:.55em 1.15em;border-radius:999px;cursor:pointer;white-space:nowrap;position:relative;z-index:1;transition:color .3s,transform .2s var(--spring)}
.seg button:active{transform:scale(.95)}
.seg button[aria-selected="true"]{color:var(--at)}
.seg .thumb{position:absolute;z-index:0;top:0;bottom:0;left:0;border-radius:999px;will-change:transform;
  background:var(--thumbbg) padding-box,var(--thumbrim) border-box;border:1px solid transparent;
  box-shadow:0 4px 14px rgba(80,70,77,.18),inset 0 1px 1px var(--hi),inset 0 -2px 5px rgba(50,42,48,.05);
  transition:width .5s var(--spring)}
.seg.in{background:rgba(154,143,151,.1);border:1px solid var(--hair);padding:3px;display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;box-shadow:inset 0 1px 3px rgba(50,42,48,.06)}
.seg.in::-webkit-scrollbar{display:none}
.seg.in button{font-size:.86rem;padding:.42em .95em}
.seg.in .thumb{top:3px;bottom:3px}
.main .sm{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;max-width:min(100%,1080px);padding:5px;border-radius:999px;scrollbar-width:none;scroll-behavior:smooth}
.chips::-webkit-scrollbar{display:none}
.chips button .ic{margin-right:.4em;vertical-align:-.16em}
.chips button{appearance:none;flex:none;border:0;background:none;color:var(--ink);font:inherit;font-size:.86rem;font-weight:550;padding:.42em .95em;border-radius:999px;cursor:pointer;transition:background .3s var(--ease),color .3s,transform .2s var(--spring),box-shadow .3s}
.chips button:hover{background:var(--hov)}
.chips button:active{transform:scale(.95)}
.chips button[aria-selected="true"]{background:var(--a1);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px color-mix(in srgb,var(--a1) 38%,transparent)}
.pr{display:inline-block;width:11px;height:11px;border-radius:50%;margin-left:.5em;vertical-align:-1px;background:conic-gradient(currentColor calc(var(--p,0)*1turn),color-mix(in srgb,currentColor 20%,transparent) 0);transition:--p .5s}

main{max-width:1080px;margin:0 auto;padding-block:22px 80px;padding-inline:16px;overflow-x:clip}
/* unit switcher: the units of the selected subject */
.units{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 6px 6px}
.ulabel{font-size:.76rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.units .seg button{display:flex;align-items:center;gap:.45em}
.units .uclear{margin-left:auto}
/* mastery levels */
.lvl{display:inline-flex;align-items:center;gap:.6em;margin:.8em 0 0;padding:.32em .85em .32em .5em;border-radius:999px;background:var(--glass2);border:1px solid var(--hair);font-size:.84rem;color:var(--ink2);max-width:100%;box-shadow:inset 0 1px 0 var(--hi)}
.lvl b{color:var(--at)}
.lvs{display:inline-flex;gap:3px;flex:none}.lvs i{width:16px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--a1) 18%,transparent);transition:background .4s}.lvs i.on{background:var(--a1)}
.lvs.big i{width:auto;flex:1;height:8px;border-radius:4px}.lvs.big{display:flex;margin:.3em 0 .2em}
.lvn{display:flex;justify-content:space-between;font-size:.74rem;color:var(--ink2);margin-bottom:.4em}
.pr.m{background:none;width:13px;height:13px;vertical-align:-2px}
.chips button[aria-selected="true"] .pr.m{color:#fff}
.lvnum{font:700 1.9rem/1 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:var(--at)}
/* rounds: daily challenge, mastery practice, boss round */
.score.low{color:var(--bad)}
.lockd{display:flex;gap:14px;align-items:center}
.bic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--fig2);color:var(--ink2);border:1px solid var(--hair)}
.bossmk{display:inline-grid;color:var(--at);margin-left:.1em}
.seg button.tdue::after{content:"";position:absolute;top:7px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--a1);box-shadow:0 0 0 2px var(--fig)}
/* weekly goal */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:.7em 0;max-width:22rem}
.wd{display:grid;justify-items:center;gap:4px;font-size:.74rem;color:var(--ink2)}
.wd i{width:30px;height:30px;border-radius:50%;border:2px solid var(--hair);display:grid;place-items:center;background:var(--glass2)}
.wd.on i{background:var(--a1);border-color:var(--a1);color:#fff}
.wd.now i{box-shadow:0 0 0 3px color-mix(in srgb,var(--a1) 30%,transparent)}
/* experience table, next steps */
.xpt td{padding:.32em .5em;font-size:.88rem}.xpt td:last-child{text-align:right}
.barrow.nx{grid-template-columns:minmax(0,1fr) auto auto}
/* progress map */
.pmap{display:grid;gap:16px}
.pm-h{display:flex;align-items:center;gap:.5em;font-weight:650;font-size:.95rem;margin-bottom:6px;flex-wrap:wrap}.pm-h .hint{font-weight:400;font-size:.82rem}
.pm-path{display:flex;align-items:center;flex-wrap:wrap;row-gap:10px}
.pm-n{appearance:none;flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink2);background:var(--glass2);border:2px solid var(--hair);transition:transform .2s var(--spring),background .3s,border-color .3s}
.pm-n:hover{transform:scale(1.08)}.pm-n:active{transform:scale(.94)}
.pm-n[data-lv="1"]{border-color:color-mix(in srgb,var(--a1) 50%,transparent);color:var(--at);background:conic-gradient(color-mix(in srgb,var(--a1) 32%,transparent) calc(var(--p,0)*1turn),var(--glass2) 0)}
.pm-n[data-lv="2"]{border-color:var(--a1);color:var(--at);background:color-mix(in srgb,var(--a1) 22%,var(--glass2))}
.pm-n[data-lv="3"]{border-color:var(--a1);background:var(--a1);color:#fff}
.pm-n.boss{border-style:dashed}.pm-n.boss.won{border-style:solid;border-color:var(--a1);background:var(--a1);color:#fff}
.pm-l{flex:1 0 10px;max-width:30px;height:3px;border-radius:2px;background:var(--hair)}.pm-l.on{background:var(--a1)}
/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:8px}
.badge{display:flex;gap:11px;align-items:flex-start;padding:.65em .8em;border-radius:16px;background:var(--glass2);border:1px solid var(--hair);box-shadow:inset 0 1px 0 var(--hi)}
.badge b{display:block;font-size:.9rem}.badge span{display:block;font-size:.78rem;color:var(--ink2)}
.badge.got .bic{background:var(--a1);border-color:var(--a1);color:#fff}
.badge:not(.got){opacity:.7}.badge .bdate{color:var(--at);font-weight:600;margin-top:.2em}
/* speed rounds */
.speed{margin-top:.8em;padding-top:.7em;border-top:1px solid var(--hair)}
.speed .qh b{font-size:.95rem}
.sp-term{font-size:1.25rem;font-weight:650;margin:.3em 0 .4em}
.hs-side .speed .ops{grid-template-columns:1fr}
.speed .op:disabled{cursor:default}
/* answer combo */
.combo{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:65;display:flex;align-items:center;gap:.45em;padding:.5em 1em;border-radius:999px;font:700 .95rem ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:var(--at);pointer-events:none;opacity:0;transform:translateY(12px) scale(.9);transition:opacity .3s,transform .4s var(--spring)}
.combo.on{opacity:1;transform:none}
.combo.pop{animation:cpop .6s var(--spring)}
.combo.pop::after{content:"";position:absolute;inset:-2px;border-radius:inherit;border:2px solid var(--a1);pointer-events:none;animation:cring .75s ease-out forwards}
@keyframes cpop{35%{transform:scale(1.3)}}
@keyframes cring{from{opacity:.85;transform:scale(1)}to{opacity:0;transform:scale(1.9,2.4)}}
@media(prefers-reduced-motion:reduce){.combo.pop::after{display:none}}
/* confirm dialog and short status message */
dialog.confirm{border-radius:24px;padding:22px;max-width:min(31rem,calc(100vw - 32px));color:var(--ink);background:var(--fig);border:1px solid var(--hair);box-shadow:0 24px 60px var(--shadow)}
dialog.confirm[open]{animation:rise .3s var(--ease)}
dialog.confirm::backdrop{background:rgba(28,26,27,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog.confirm h3{margin-top:0}
dialog.confirm .row{justify-content:flex-end;margin:1em 0 0}
.btn.danger{background:var(--bad);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 14px color-mix(in srgb,var(--bad) 30%,transparent)}
[data-mode="dark"] .btn.danger{color:#1c1a1b}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;max-width:calc(100vw - 32px);padding:.6em 1.1em;border-radius:999px;background:var(--ink);color:var(--bg);font-size:.9rem;font-weight:600;box-shadow:0 10px 28px var(--shadow);animation:rise .3s var(--ease)}
.lhead{padding:10px 6px 18px;display:flex;align-items:center;justify-content:space-between;gap:28px}
.lhead>div:first-child{min-width:0}
.emblem{flex:none;display:grid;justify-items:center;gap:7px;color:var(--at)}
.em-ring{width:82px;height:82px;border-radius:50%;padding:5px;background:conic-gradient(var(--a1) calc(var(--p,0)*1turn),color-mix(in srgb,var(--a1) 15%,transparent) 0);transition:--p .9s var(--ease)}
.em-in{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--fig);box-shadow:inset 0 1px 0 var(--hi),0 3px 10px var(--shadow)}
.em-in .ic{stroke-width:1.45}
.emblem small{font:600 .78rem ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:var(--ink2);font-variant-numeric:tabular-nums;min-height:1em}
@media(max-width:640px){.emblem{display:none}}
h1{font-size:clamp(2.1rem,6vw,3.4rem);line-height:1.05;letter-spacing:-.025em;font-weight:700;margin:0 0 .25em;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif}
.lede{font-size:1.12rem;color:var(--ink2);max-width:62ch;margin:0}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{grid-column:span 12;border-radius:28px;padding:22px;min-width:0;position:relative;isolation:isolate}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;opacity:0;transition:opacity .5s;
  background:radial-gradient(520px circle at var(--mx,50%) var(--my,0%),var(--sheen),transparent 62%)}
.card:hover::before{opacity:1}
.grid>.card:nth-child(n+3){content-visibility:auto;contain-intrinsic-size:auto 520px}

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function el(t,a={},h){const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else e.setAttribute(k,a[k]);}if(h!=null)e.innerHTML=h;return e;}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sig(x,n=3){
  if(x===0)return '0';if(!isFinite(x))return '?';
  const a=Math.abs(x);
  if(a>=1e4||a<1e-2){let e=Math.floor(Math.log10(a));let m=x/10**e;if(Math.abs(+m.toPrecision(n))>=10){m/=10;e++;}
    return m.toPrecision(n)+' × 10<sup>'+String(e).replace('-','−')+'</sup>';}
  let s=x.toPrecision(n);if(s.includes('e'))s=String(Number(s));return s.replace('-','−');
}
const C=s=>s.replace(/\^([0-9]*[+-])/g,(m,c)=>'<sup>'+c.replace('-','−')+'</sup>').replace(/([A-Za-z\)])(\d+)/g,'$1<sub>$2</sub>').replace(/<=>/g,'⇌').replace(/->/g,'→');
function bearing(x,y){
  const a=Math.atan2(Math.abs(y),Math.abs(x))*180/Math.PI;
  if(Math.hypot(x,y)<1e-9)return 'no direction';
  if(a<0.05)return x>0?'East':'West';if(a>89.95)return y>0?'North':'South';
  return a.toFixed(1)+'° '+(y>0?'N':'S')+' of '+(x>0?'E':'W');
}

/* ---------- saved answers: this browser first, then the account store if the viewer grants it ---------- */
const Store=(()=>{
  const KEY='unit-study-site.v2',MAPS=['a','r','s','w','h','g'];let D={a:{},r:{},s:{},w:{},h:{},g:{},pos:null};
  try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&typeof o==='object'){MAPS.forEach(m=>{D[m]=o[m]||{};});D.pos=o.pos||null;}}}catch(e){}
  const subs=[];let ref=null,dirty=false,busy=false,timer=0,mode='device',lastPull=0;
  const emit=()=>subs.forEach(f=>{try{f();}catch(e){}});
  const local=()=>{try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}};
  async function push(){if(!ref||busy||!dirty)return;busy=true;dirty=false;
    try{await ref.set(JSON.parse(JSON.stringify({v:3,a:D.a,r:D.r,s:D.s,w:D.w,h:D.h,g:D.g})));}
    catch(e){const c=e&&e.code;if(c==='unavailable'||c==='resource_exhausted')dirty=true;else{ref=null;mode='device';emit();}}
    busy=false;if(dirty&&ref){clearTimeout(timer);timer=setTimeout(push,4000);}}
  const later=ms=>{dirty=true;clearTimeout(timer);timer=setTimeout(push,ms);};
  const touch=()=>{local();if(ref)later(1500);};
  function merge(R){let ch=false,up=false;
    MAPS.forEach(m=>{const rm=(R&&R[m])||{},lm=D[m];
      for(const k in rm){const l=lm[k],r=rm[k];if(r&&(!l||(r.t||0)>(l.t||0))){lm[k]=r;ch=true;}}
      for(const k in lm){const r=rm[k];if(!r||(lm[k].t||0)>(r.t||0))up=true;}});
    if(ch){local();emit();}if(up)later(800);}
  async function pull(){if(!ref)return;lastPull=Date.now();try{const s=await ref.get();merge(s.exists?s.data():null);}catch(e){}}
  async function connect(){try{if(!window.claude||typeof window.claude.use!=='function')return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db||!user)return;
    const id=await user.id();if(!id)return;ref=db.doc('data/users/'+id+'/progress');mode='account';emit();await pull();}catch(e){}}
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(dirty&&ref){clearTimeout(timer);push();}}else if(ref&&Date.now()-lastPull>60000)pull();});
  const g=(m,id)=>{const e=D[m][id];return e&&!e.x?e:null;},p=(m,id,e)=>{D[m][id]=Object.assign({},e,{t:Date.now()});touch();};
  return {get:id=>g('a',id),set:(id,e)=>p('a',id,e),del(id){if(g('a',id))p('a',id,{x:1});},
    rev:k=>g('r',k),setRev:(k,o)=>p('r',k,o),
    sr:id=>g('s',id),srSet:(id,o)=>p('s',id,o),srAll:()=>Object.keys(D.s).filter(k=>!D.s[k].x).map(k=>[k,D.s[k]]),
    w:k=>{const e=g('w',k);return e?e.v:null;},wSet:(k,v)=>p('w',k,{v}),
    x:(m,k)=>g(m,k),xs:(m,k,e)=>p(m,k,e),xk:m=>Object.keys(D[m]).filter(k=>!D[m][k].x),
    clear(f){let n=0;const t=Date.now();MAPS.forEach(m=>{for(const k in D[m])if(!D[m][k].x&&f(m,k)){D[m][k]={x:1,t};n++;}});if(n){touch();emit();}return n;},
    pos:()=>D.pos,setPos(q){D.pos=q;local();},on:f=>subs.push(f),mode:()=>mode,connect};
})();
/* spaced repetition: a missed question comes back after 1, 3 and 7 days */
const SRI=[1,3,7],DAY=864e5;
function srMark(id,ok){if(!id)return;const e=Store.sr(id),now=Date.now();
  if(!ok){Store.srSet(id,{b:0,d:now+SRI[0]*DAY});return;}
  if(e&&now>=e.d){const b=e.b+1;if(b>=SRI.length){Store.srSet(id,{x:1});Store.xs('g','srOut',{n:gN('srOut')+1});}else Store.srSet(id,{b,d:now+SRI[b]*DAY});}}

/* ---------- controls ---------- */
function ctl(host,defs,on){
  const box=el('div',{class:'ctl'}),v={},sets={};
  defs.forEach(d=>{
    const row=el('label',{class:'sl'},`<span>${d.l}</span><input type="range" min="${d.min}" max="${d.max}" step="${d.step||1}" value="${d.v}"><output></output>`);
    const inp=row.children[1],out=row.children[2];
    const upd=()=>{v[d.k]=+inp.value;out.innerHTML=(d.f?d.f(v[d.k]):(+inp.value).toFixed(d.dp||0))+(d.u?' '+d.u:'');};
    inp.addEventListener('input',()=>{upd();on&&on(v);});upd();sets[d.k]=x=>{inp.value=x;upd();};box.append(row);
  });
  host.append(box);
  return {v,box,set(o){for(const k in o)sets[k]&&sets[k](o[k]);on&&on(v);}};
}
function arrowKeys(box,btns,cur){box.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();const b=btns(),n=(cur()+d+b.length)%b.length;b[n].focus();b[n].click();});}
/* segmented control: the glass thumb stretches while it moves */
function seg(host,labels,on,cls='in'){
  const s=el('div',{class:'seg '+cls,role:'tablist'}),th=el('i',{class:'thumb'});s.append(th);let cur=0,px=null;
  const btns=labels.map((l,i)=>{const b=el('button',{type:'button',role:'tab'},l);b.onclick=()=>{if(i===cur)return;set(i,true);on&&on(i);};s.append(b);return b;});
  function place(anim){const b=btns[cur];if(!b.offsetWidth)return;const x=b.offsetLeft;th.style.width=b.offsetWidth+'px';
    if(anim&&px!=null&&px!==x&&!RM&&th.animate){const d=Math.abs(x-px);th.animate([{transform:`translateX(${px}px) scale(1,1)`},{transform:`translateX(${(px+x)/2}px) scale(${1+Math.min(.24,d/500)},.84)`,offset:.42},{transform:`translateX(${x}px) scale(1,1)`}],{duration:540,easing:'cubic-bezier(.3,1.2,.5,1)'});}
    th.style.transform=`translateX(${x}px)`;px=x;
    if(anim&&s.scrollWidth>s.clientWidth+2)s.scrollTo({left:x-s.clientWidth/2+b.offsetWidth/2,behavior:'smooth'});}
  function set(i,anim){cur=i;btns.forEach((b,j)=>{b.setAttribute('aria-selected',j===i);b.tabIndex=j===i?0:-1;});place(anim);}
  new ResizeObserver(()=>place(false)).observe(s);arrowKeys(s,()=>btns,()=>cur);host.append(s);set(0);
  return {set:i=>set(i,true),get:()=>cur,el:s};
}
function stats(host,labels){
  const box=el('div',{class:'stats'});
  const vs=labels.map(l=>{const d=el('div',{class:'stat'},`<span>${l}</span><b>-</b>`);box.append(d);return d;});
  host.append(box);const last=[];
  const f=(i,h)=>{h=String(h);if(last[i]!==h){last[i]=h;vs[i].children[1].innerHTML=h;}};return f;
}
function card(host,title,html,cls=''){const c=el('section',{class:'card glass '+cls},(title?`<h3>${title}</h3>`:'')+(html||''));host.append(c);return c;}
function ex(title,html){return `<details class="ex"><summary>${title}</summary><div>${html}</div></details>`;}
const BTNIC=t=>/^(Run|Start|Play|Release|Fire|Send)\b/.test(t)?icon('play',14):/^Reset$/.test(t)?icon('reset',14):'';
function btnRow(host,defs){const r=el('div',{class:'row'});defs.forEach(([t,fn,cls])=>{const b=el('button',{type:'button',class:'btn sm '+(cls||'')},BTNIC(t)+t);b.onclick=()=>fn(b);r.append(b);});host.append(r);return r;}
/* colour key under a picture: [css colour, text] pairs */
function legendRow(host,items){const d=el('p',{class:'legend'},items.map(([c2,t])=>`<span><i class="dot" style="background:${c2}"></i><span>${t}</span></span>`).join(''));host.append(d);return d;}
const fx=(e,cls)=>{e.classList.remove(cls);void e.offsetWidth;e.classList.add(cls);};

/* ---------- questions ---------- */
function parseNum(s){s=String(s).trim().replace(/\s/g,'').replace(/−/g,'-').replace(/[×x\*]10\^?/i,'e').replace(/,/g,'');return parseFloat(s);}
const ansText=it=>it.o?it.o[it.a]:(it.ans||sig(it.n))+' '+(it.u||'');
const sentences=w=>{const p=String(w||'').split('. ');return p.map((x,i)=>i<p.length-1?x+'.':x).filter(Boolean);};
/* find a common mistake in a numeric answer */
function diagnose(x,it){const n=it.n;if(!isFinite(x)||!n)return '';const r=x/n,near=(a,b,t=.025)=>Math.abs(a-b)<=t*Math.abs(b),ph=it.abs&&it.tol===0&&!it.u&&n>0&&n<14;
  if(ph)return near(x,14-n,.01)?'This is the value for the other ion. Use pH + pOH = 14.00.':Math.abs(x-n)<.3?'You are close. Keep more digits in the intermediate steps and round only at the end.':'';
  if(near(x,-n))return 'The size is correct, but the sign is wrong. Check the direction that you set as positive, or give the magnitude.';
  if(near(r,3.6)||near(r,1/3.6))return 'Your answer is different by a factor of 3.6. Check the conversion between km/h and m/s.';
  if(r>0){const lg=Math.log10(r);if(Math.abs(lg)>.5&&Math.abs(lg-Math.round(lg))<.011)return 'Your digits are correct, but the power of ten is wrong. Check the unit conversions (g and kg, mL and L, ms and s, cm and m).';}
  if(near(r,2)||near(r,.5))return 'Your answer is different by a factor of 2. Check a coefficient, a mole ratio, or the ½ in the kinetic energy formula.';
  if(near(r,9.81)||near(r,1/9.81))return 'Your answer is different by a factor of 9.81. Check if the question gives a weight (N) or a mass (kg).';
  if(n>0&&x>0&&near(x,1/n))return 'You have the reciprocal of the answer. Check which quantities are on the top and on the bottom.';
  if(n>0&&x>0&&n!==1&&(near(x,n*n)||near(x,Math.sqrt(n))))return 'Check the exponent or the square root in your calculation.';
  if(Math.abs(r-1)<.08)return 'You are close. Keep more digits in the intermediate steps and round only at the end.';
  return '';}
/* one question. sv is a saved answer or null. cb receives {v,ok,s}. In test mode a numeric question has one attempt and no hints. */
function qEl(it,label,sv,cb,test){
  const q=el('div',{class:'q'},`<p class="qt">${label?`<b>${label}</b> `:''}${it.q}</p>${it.fig?`<div class="qfig">${it.fig}</div>`:''}`),fb=el('p',{class:'fb',hidden:'','aria-live':'polite'});
  const say=(cls,h)=>{fb.hidden=false;fb.className='fb '+cls;fb.innerHTML=h;};
  if(it.o){
    const ops=el('div',{class:'ops'}),btn={};
    const lock=(j,anim)=>{q.dataset.done=1;const ok=j===it.a;btn[j].classList.add(ok?'ok':'bad');btn[it.a].classList.add('ok');if(anim)fx(btn[j],ok?'pop':'shake');say(ok?'ok':'bad',(ok?'Correct. ':'Not correct. ')+(it.w||''));};
    shuffle(it.o.map((_,j)=>j)).forEach(j=>{const b=el('button',{type:'button',class:'op'},it.o[j]);btn[j]=b;b.onclick=()=>{if(q.dataset.done)return;lock(j,true);cb({v:j,ok:j===it.a?1:0});};ops.append(b);});
    q.append(ops);if(sv&&btn[sv.v])lock(sv.v,false);
  }else{
    const steps=test?[]:(it.m?[it.m]:[]).concat(sentences(it.w).slice(0,-1));let hi=0;
    const row=el('div',{class:'num'},`<input type="text" inputmode="decimal" autocomplete="off" placeholder="Your answer" aria-label="Your answer"><span>${it.u||''}</span><button type="button" class="btn sm">Check</button>`+(test?'':(steps.length?'<button type="button" class="btn sm ghost" data-h>'+icon('bulb',15)+'Hint</button>':'')+'<button type="button" class="btn sm ghost" data-s>Show answer</button>'));
    const inp=row.children[0],hl=el('ol',{class:'hints','aria-live':'polite'});
    const good=x=>Math.abs(x-it.n)<=Math.max((it.tol??.02)*Math.abs(it.n),it.abs||1e-12);
    const ans=()=>`<b>Answer: ${ansText(it)}</b>. ${it.w||''}`;
    const show=(e,anim)=>{const d=e.ok?'':diagnose(parseNum(e.v),it);
      if(e.s&&!e.ok)say('info',ans()+' <span class="hint">This question does not count as correct now. Clear your answers to try it again.</span>');
      else if(e.ok)say('ok','Correct. '+(it.w||''));
      else say('bad',test?'Not correct. '+(d?d+' ':'')+ans():'Not correct. '+(d||'Check the sign, the units and the conversions.')+(steps.length?' Use a hint or try again.':' Try again.'));
      if(anim&&!e.s)fx(row,e.ok?'pop':'shake');};

const f1=n=>+(+n).toFixed(1);

/* stroked paths from [width, d] pairs. Draw them two times, wider and darker first, to give every branch an outline */
const strokes=(L,color,ex=0)=>`<g fill="none" stroke="${color}" stroke-linecap="round" stroke-linejoin="round">${L.map(([w,d])=>`<path d="${d}" stroke-width="${f1(w+ex)}"/>`).join('')}</g>`;
/* mirror a path about a vertical line: x becomes 2*cx - x */
const mirrorX=(d,cx)=>d.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g,(m,x,y)=>f1(2*cx-x)+','+y);
/* copy of some shapes in the colour of the figure surface. It goes under the real shapes, thus a dimmed part does not show the parts behind it */
const backing=s=>'<g pointer-events="none">'+s.replace(/ data-(p|a)="[^"]*"/g,'').replace(/ id="[^"]*"/g,'').replace(/(fill|stroke|stop-color)="(var\([^)]*\)|url\([^)]*\)|#[0-9a-fA-F]+)"/g,'$1="var(--fig)"')+'</g>';

const stack=s=>s.split('\n').filter(Boolean).map(l=>backing(l)+l).join('');

/* tube that gets thinner along its length: steps of [part of the length in percent, width] */
const taper=(d,steps,c1,c2)=>steps.map(([p,w])=>`<path d="${d}" fill="none" stroke="${c2}" stroke-width="${w+2.6}" stroke-linecap="round" pathLength="100" stroke-dasharray="${p} 200"/>`).join('')+steps.map(([p,w])=>`<path d="${d}" fill="none" stroke="${c1}" stroke-width="${w}" stroke-linecap="round" pathLength="100" stroke-dasharray="${p} 200"/>`).join('');

/* phospholipid bilayer along a horizontal line. gaps are [x0,x1] pairs where a protein sits */
function bilayer(ctx,x0,x1,y,gaps=[]){
  const K=col(),sp=10.5,xs=[];ctx.lineWidth=1.3;ctx.strokeStyle=K.axis;ctx.beginPath();
  for(let x=x0+sp/2;x<x1;x+=sp){if(gaps.some(g=>x>g[0]&&x<g[1]))continue;xs.push(x);ctx.moveTo(x-2,y-9.5);ctx.lineTo(x-2,y-1.5);ctx.moveTo(x+2,y-9.5);ctx.lineTo(x+2,y-1.5);ctx.moveTo(x-2,y+9.5);ctx.lineTo(x-2,y+1.5);ctx.moveTo(x+2,y+9.5);ctx.lineTo(x+2,y+1.5);}
  ctx.stroke();ctx.fillStyle=K.steel;ctx.beginPath();xs.forEach(x=>{ctx.moveTo(x+4.3,y-13.5);ctx.arc(x,y-13.5,4.3,0,7);ctx.moveTo(x+4.3,y+13.5);ctx.arc(x,y+13.5,4.3,0,7);});ctx.fill();
}
const IONS={na:['s1','Na⁺',.9],k:['s2','K⁺',.95],ca:['s3','Ca²⁺',.74]};

/* channel protein across the membrane at (x,y). Two halves move apart when the gate is open. vert=false draws it across a vertical membrane */
function channel(ctx,x,y,color,open,vert=true,H=54){
  const gap=open?13:2.5,lw=13,g=vert?ctx.createLinearGradient(0,y-H/2,0,y+H/2):ctx.createLinearGradient(x-H/2,0,x+H/2,0);g.addColorStop(0,ctint(color,.38));g.addColorStop(1,color);
  [-1,1].forEach(s=>{const o=s<0?-gap/2-lw:gap/2;ctx.fillStyle=g;if(vert)rr(ctx,x+o,y-H/2,lw,H,6.5);else rr(ctx,x-H/2,y+o,H,lw,6.5);ctx.fill();ctx.strokeStyle=cshade(color,.28);ctx.lineWidth=1;ctx.stroke();});

      tag(ctx,'total '+sigt(pa+pb)+' '+U,xt,yb+bh+17,{size:11.5,w0:0,w1:w});}
    else{const ei=.5*v.m1*v.v1**2+.5*v.m2*v.v2**2,ea=.5*v.m1*S.va**2,eb=.5*v.m2*S.vb**2,lost=Math.max(0,ei-ea-eb),x0=16,W=w-32;
      label(ctx,w<560?'Kinetic energy of A and B, and heat and sound':'Kinetic energy of A, kinetic energy of B, and energy changed to heat and sound',16,h-62,k.ink2,'left','500 12px '+FONT);
      if(ei>0){const sc=(W-4)/ei;let x=x0;[[ea,k.s1],[eb,k.s2],[lost,calpha(k.mute,.45)]].forEach(([e,c])=>{const len=e*sc;if(len<.5)return;ctx.fillStyle=c;rr(ctx,x,yb,len,bh,3);ctx.fill();x+=len+2;});
        let tx=x0;[['A '+sigt(ea)+' J',k.s1],['B '+sigt(eb)+' J',k.s2],['heat and sound '+sigt(lost<1e-9*ei?0:lost)+' J',calpha(k.mute,.6)]].forEach(([t,c])=>{const g=tag(ctx,t,tx,yb+bh+17,{align:'left',dot:c,size:11.5});tx=g.x+g.w+8;});}}
  }
  const P=mode==='p'?[['Hit and stick',{m1:2,v1:6,m2:3,v2:0,e:0}],['Head-on, stick',{m1:.5,v1:8,m2:1,v2:-6,e:0}],['Equal masses, elastic',{m1:2,v1:5,m2:2,v2:0,e:1}],['Light cart hits heavy cart',{m1:1,v1:8,m2:9,v2:0,e:.8}]]
    :[['Elastic',{m1:2,v1:6,m2:2,v2:0,e:1}],['Stick together',{m1:2,v1:6,m2:2,v2:0,e:0}],['Head-on, stick',{m1:4,v1:7.5,m2:6,v2:-10,e:0}],['Partly elastic',{m1:3,v1:5,m2:2,v2:-10,e:.5}]];

}

SUBJ.mom={name:'Momentum',short:'Momentum',lessons:[
{t:'Momentum',d:'Momentum is the quantity of motion of an object. It is a vector.',build(g){
  card(g,'What momentum is',`
    <p>Momentum is the product of the mass of an object and its velocity.</p>
    <div class="fx"><span class="vec"><i>p</i></span> = <i>m</i><span class="vec"><i>v</i></span></div>
    <ul><li><i class="v">p</i> is the momentum in ${U}.</li><li><i class="v">m</i> is the mass in kg.</li><li><i class="v">v</i> is the velocity in m/s.</li>
    <li>The direction of the momentum is always the direction of the velocity.</li></ul>
    <div class="note">Convert before you calculate: g to kg (divide by 1000) and km/h to m/s (divide by 3.6).</div>`,'half');
  card(g,'Mass, velocity and momentum',CF(FIG.pmv(),'The orange arrows show the momentum of each cart, to scale. If the mass or the velocity is two times larger, the momentum is two times larger.'),'half');
  card(g,'Worked examples',
    ex('A 50.0 g ball is thrown up at 15.0 m/s. Find its momentum at 1.75 s.',`<p>Find the velocity first: <i class="v">v</i> = 15.0 + (−9.81)(1.75) = −2.17 m/s.</p><p><i class="v">p</i> = (0.0500 kg)(−2.17 m/s) = −0.108 ${U}. The ball moves down, thus the momentum is 0.108 ${U} down.</p>`)+
    ex('A 1200 kg car moves at 54.0 km/h [N]. A 2000 kg truck moves at 90.0 km/h [E]. Find each momentum and the total.',`<p>Car: (1200)(15.0) = 1.80 × 10<sup>4</sup> ${U} [N]. Truck: (2000)(25.0) = 5.00 × 10<sup>4</sup> ${U} [E].</p><p>The vectors are at a right angle. Total = √(1.80² + 5.00²) × 10<sup>4</sup> = 5.31 × 10<sup>4</sup> ${U}. Angle = tan<sup>−1</sup>(1.80 / 5.00) = 19.8° N of E.</p>`)+
    ex('A 10.0 g rock is thrown horizontally at 10.0 m/s from a height of 1.75 m. Find the direction of its momentum at the ground.',`<p>Vertical speed at the ground: √(2 × 9.81 × 1.75) = 5.86 m/s. The horizontal speed stays 10.0 m/s.</p><p>Angle = tan<sup>−1</sup>(5.86 / 10.0) = 30.4° below the horizontal. The momentum has the same direction as the velocity.</p>`));
  const c=card(g,'Two vehicles at an intersection',`<p class="hint">Vehicle A moves north and vehicle B moves east. Change the values. The diagram adds the two momentum vectors tip to tail.</p>`);
  let K;const cv=canvas(c,330,(ctx,w,h)=>{if(!K)return;const k=col(),v=K.v,p1=v.m1*v.v1/3.6,p2=v.m2*v.v2/3.6,wide=w>640,sx=wide?Math.min(300,w*.33):0;
    if(wide){const cx=sx/2+10,cy=h/2,rw=58,pm=Math.max(p1,p2,1);   /* road scene: A drives north, B drives east */
      ctx.fillStyle=k.fig2;ctx.fillRect(cx-rw/2,10,rw,h-20);ctx.fillRect(12,cy-rw/2,sx-4,rw);
      ctx.strokeStyle=k.axis;ctx.lineWidth=1.5;ctx.setLineDash([9,9]);ctx.beginPath();ctx.moveTo(cx,12);ctx.lineTo(cx,cy-rw/2-3);ctx.moveTo(cx,cy+rw/2+3);ctx.lineTo(cx,h-12);ctx.moveTo(14,cy);ctx.lineTo(cx-rw/2-3,cy);ctx.moveTo(cx+rw/2+3,cy);ctx.lineTo(sx+6,cy);ctx.stroke();ctx.setLineDash([]);
      const ax=cx+rw/4,ay=cy+rw/2+58,bx=cx-rw/2-58,by=cy+rw/4;
      if(p1>0)arrow(ctx,ax,ay-26,ax,ay-26-22-44*p1/pm,k.s1,3.2,{halo:1});if(p2>0)arrow(ctx,bx+26,by,bx+26+22+44*p2/pm,by,k.s2,3.2,{halo:1});
      topcar(ctx,ax,ay,-Math.PI/2,k.s1,'A');topcar(ctx,bx,by,0,k.s2,'B');
      ctx.strokeStyle=k.gridc;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sx+22.5,16);ctx.lineTo(sx+22.5,h-16);ctx.stroke();}
    const ox=sx+(wide?80:54),oy=h-64,s=Math.min((w-ox-(wide?120:96))/Math.max(p2,1),(h-128)/Math.max(p1,1)),tx=ox+p2*s,ty=oy-p1*s;
    label(ctx,'Momentum vectors, tip to tail',ox-(wide?40:36),20,k.ink2,'left','500 12px '+FONT);compass(ctx,w-36,40);
    if(p1>0&&p2>0){ctx.strokeStyle=k.axis;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(tx-11,oy);ctx.lineTo(tx-11,oy-11);ctx.lineTo(tx,oy-11);ctx.stroke();
      const th=Math.atan2(p1,p2);angleArc(ctx,ox,oy,Math.min(46,p2*s*.4),-th,0,(th*180/Math.PI).toFixed(1)+'°');}
    arrow(ctx,ox,oy,tx,oy,k.s2,4,{halo:1});arrow(ctx,tx,oy,tx,ty,k.s1,4,{halo:1});arrow(ctx,ox,oy,tx,ty,k.ink,2.4,{dash:[7,5]});
    if(p2>0)tag(ctx,'p of B',ox+p2*s/2,oy+20,{dot:k.s2,w0:0,w1:w});if(p1>0)tag(ctx,'p of A',tx+12,oy-p1*s/2,{align:'left',dot:k.s1,w0:0,w1:w});
    if(p1>0&&p2>0)tag(ctx,'total',(ox+tx)/2-18,(oy+ty)/2-16,{w0:0,w1:w});});
  const R=stats(c,['Momentum of A','Momentum of B','Total momentum','Direction of the total']);
  const upd=v=>{const p1=v.m1*v.v1/3.6,p2=v.m2*v.v2/3.6;R(0,sig(p1)+' '+U+' [N]');R(1,sig(p2)+' '+U+' [E]');R(2,sig(Math.hypot(p1,p2))+' '+U);R(3,bearing(p2,p1));cv.draw();};
  K=ctl(c,[{k:'m1',l:'Mass of A',min:500,max:3000,step:50,v:1200,u:'kg'},{k:'v1',l:'Speed of A',min:0,max:120,v:54,u:'km/h'},{k:'m2',l:'Mass of B',min:500,max:3000,step:50,v:2000,u:'kg'},{k:'v2',l:'Speed of B',min:0,max:120,v:90,u:'km/h'}],upd);upd(K.v);
},qz:[
    {q:'A 500 kg vehicle moves at 90.0 km/h. Calculate its momentum.',n:12500,u:U,w:'90.0 km/h = 25.0 m/s. p = (500)(25.0) = 1.25 × 10⁴ kg·m/s.'},
    {q:'How fast must a 2.00 g flea move to have the same momentum as that vehicle?',n:6.25e6,u:'m/s',w:'v = p / m = 12 500 / 0.00200 = 6.25 × 10⁶ m/s.'},
    {q:'An object of mass <i class="v">m</i> falls from rest from a height <i class="v">H</i>. Which expression gives its momentum when it is halfway to the ground?',o:['<i class="v">m</i>√(<i class="v">gH</i>)','<i class="v">m</i>√(2<i class="v">gH</i>)','<i class="v">mgH</i>','½<i class="v">m</i>√(<i class="v">gH</i>)'],a:0,w:'After a fall of H/2, v² = 2g(H/2) = gH. Thus p = m√(gH). At the ground, p = m√(2gH).'},
    {q:'A 750 kg plane flies north at 27.8 m/s. A cross wind moves it west at 11.2 m/s. Calculate the magnitude of the resultant momentum.',n:22480,u:U,w:'Resultant speed = √(27.8² + 11.2²) = 29.97 m/s. p = (750)(29.97) = 2.25 × 10⁴ kg·m/s.'},
    {q:'For the same plane, give the angle of the momentum measured west of north.',n:21.9,u:'° W of N',tol:.03,w:'tan θ = 11.2 / 27.8, thus θ = 21.9° W of N.'}]},
{t:'Impulse',d:'A net force that acts for a time interval changes the momentum of an object.',build(g){
  card(g,'Impulse and Newton\'s second law',`
    <p>A net force accelerates an object for the full time that the force acts. Start from Newton's second law:</p>
    <div class="fx"><span class="vec"><i>F</i></span><sub>net</sub> = <i>m</i><span class="vec"><i>a</i></span> = <i>m</i> <span class="frac"><span>Δ<span class="vec"><i>v</i></span></span><span>Δ<i>t</i></span></span> &nbsp;→&nbsp; <span class="vec"><i>F</i></span><sub>net</sub>Δ<i>t</i> = <i>m</i>Δ<span class="vec"><i>v</i></span> = Δ<span class="vec"><i>p</i></span></div>
    <ul><li>A force that acts for an interval of time is an <span class="key">impulse</span>.</li><li>Impulse is a vector. It points in the direction of the average net force.</li>
    <li>Impulse is equal to the change in momentum.</li><li>Units: 1 N·s = 1 ${U}.</li></ul>`,'half');
  card(g,'One impulse, two forces',CF(FIG.impulse(),'The two shaded areas are equal, thus the two impulses are equal. For the same change in momentum, a longer time gives a smaller force.'),'half');
  card(g,'Worked examples',
    ex('A 1200 kg car moves north at 54.0 km/h. The brakes apply a net force of 4000 N for 3.0 s. Find the final velocity.',`<p>Take north as positive. The force is south: F Δt = (−4000)(3.0) = −12 000 N·s.</p><p>Δv = −12 000 / 1200 = −10 m/s. v<sub>f</sub> = 15.0 − 10 = 5.0 m/s [N].</p>`)+
    ex('A 450 g ball falls 1.00 m, hits the ground and goes back up to 0.80 m. Find the impulse from the ground.',`<p>Speed before the bounce: √(2 × 9.81 × 1.00) = 4.43 m/s down. Speed after: √(2 × 9.81 × 0.80) = 3.96 m/s up.</p><p>Take up as positive. Impulse = m Δv = (0.450)(3.96 − (−4.43)) = 3.8 N·s up.</p>`)+
    ex('A racquet hits a 300 g ball that moves south at 10 m/s. The force graph is a triangle from 1.0 ms to 5.0 ms with a peak of 3300 N.',`<p>Impulse = area = ½ (4.0 × 10<sup>−3</sup> s)(3300 N) = 6.6 N·s north.</p><p>Take north as positive: m v<sub>f</sub> = m v<sub>i</sub> + impulse = (0.300)(−10) + 6.6 = 3.6 ${U}. v<sub>f</sub> = 12 m/s north.</p>`));
  // crash test
  const c=card(g,'Force and time: stop a crash test dummy',`<p class="hint">The dummy must lose all of its momentum. The change in momentum is fixed, thus the force and the stopping time have an inverse relationship. Safety devices increase the stopping time.</p>`);
  let K;const cv=canvas(c,300,(ctx,w,h)=>{if(!K)return;const k=col(),dp=K.v.m*K.v.v,ymax=niceMax(dp/.005/1000,4),P=plot(ctx,w,h,{x0:0,x1:160,y0:0,y1:ymax,xt:8,yt:4,xd:0,yd:0,xl:'Stopping time (ms)',yl:'Average net force (kN)',xn:'Stopping time',xu:'ms',yu:'kN'});
    const pts=[];for(let t=5;t<=160;t+=1)pts.push([t,dp/(t/1000)/1000]);P.area(pts,k.s1,0,.1).line(pts,k.s1,{n:'Average net force'});
    const t=K.v.t,F=dp/(t/1000)/1000;ctx.save();ctx.strokeStyle=k.axis;ctx.lineWidth=1.2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(P.X(t),P.Y(0));ctx.lineTo(P.X(t),P.Y(F));ctx.lineTo(P.X(0),P.Y(F));ctx.stroke();ctx.restore();
    P.knob(t,F,k.s1);tag(ctx,sigt(F)+' kN at '+t+' ms',P.X(t)+14,P.Y(F)-18,{align:'left',w0:P.L,w1:w-P.R});});
  const R=stats(c,['Change in momentum','Average net force','Compared with an 81.0 ms stop']);
  const upd=v=>{const dp=v.m*v.v,F=dp/(v.t/1000);R(0,sig(dp)+' '+U);R(1,sig(F)+' N');R(2,'× '+sig(81/v.t,2));cv.draw();};
  K=ctl(c,[{k:'m',l:'Mass',min:50,max:100,step:1,v:73,u:'kg'},{k:'v',l:'Speed before impact',min:5,max:30,step:.5,v:14,dp:1,u:'m/s'},{k:'t',l:'Stopping time',min:5,max:150,step:1,v:81,u:'ms'}],upd);
  btnRow(c,[['Seatbelt (81.0 ms)',()=>K.set({t:81})],['No seatbelt (9.0 ms)',()=>K.set({t:9}),'ghost']]);upd(K.v);
  // F-t graph
  const d=card(g,'Impulse from a force-time graph',`<p class="hint">If the force changes, the impulse is the area between the line and the time axis. Area below the axis is negative. Drag the points to change the graph.</p>`);
  let F=[24,17,10,10,10,10],K2;
  const cv2=canvas(d,330,(ctx,w,h)=>{const k=col(),P=plot(ctx,w,h,{x0:0,x1:5,y0:-20,y1:40,xt:5,yt:6,xd:0,yd:0,xl:'Time (s)',yl:'Net force (N)',hover:false,leg:1});let ap=0,an=0;
    for(let i=0;i<5;i++){const a=F[i],b=F[i+1],part=(x1,y1,x2,y2)=>{const A=(y1+y2)/2*(x2-x1);if(A>=0)ap+=A;else an+=A;P.area([[x1,y1],[x2,y2]],A>=0?k.s1:k.s2,0,.2);};
      if(a*b<0){const xz=i+a/(a-b);part(i,a,xz,0);part(xz,0,i+1,b);}else part(i,a,i+1,b);}
    P.line(F.map((f,i)=>[i,f]),k.ink,{w:2.2});F.forEach((f,i)=>P.knob(i,f,k.s1));
    let lx=P.L;[['area above the axis: +'+sigt(ap)+' N·s',k.s1],['area below the axis: '+sigt(an)+' N·s',k.s2]].forEach(([t,c],i)=>{if(i&&an===0)return;const g=tag(ctx,t,lx,P.T-15,{align:'left',dot:c,size:11.5,bg:false,color:k.ink2,w:500});lx=g.x+g.w+18;});cv2.map=P;});
  dragOn(cv2,(x,y)=>{const P=cv2.map;if(!P)return null;let b=null,bd=28;F.forEach((f,i)=>{const dd=Math.hypot(P.X(i)-x,P.Y(f)-y);if(dd<bd){bd=dd;b=i;}});return b;},
    (i,x,y)=>{const P=cv2.map,v=-20+(cv2.h-P.B-y)/(cv2.h-P.T-P.B)*60;F[i]=clamp(Math.round(v),-20,40);upd2();});
  const R2=stats(d,['Impulse (signed area)','Change in velocity','Final velocity']);
  const upd2=()=>{let A=0;for(let i=0;i<5;i++)A+=(F[i]+F[i+1])/2;const dv=A/K2.v.m;R2(0,sig(A)+' N·s');R2(1,sig(dv)+' m/s');R2(2,sig(K2.v.vi+dv)+' m/s');cv2.draw();};
  K2=ctl(d,[{k:'m',l:'Mass',min:.2,max:10,step:.1,v:1.8,dp:1,u:'kg'},{k:'vi',l:'Initial velocity',min:-20,max:20,step:.5,v:0,dp:1,u:'m/s'}],upd2);
  btnRow(d,[['Homework graph',()=>{F=[24,17,10,10,10,10];upd2();}],['Constant force',()=>{F=[20,20,20,20,20,20];upd2();},'ghost'],['Force changes direction',()=>{F=[20,10,0,-10,-10,-10];upd2();},'ghost']]);upd2();
},qz:[
    {q:'An average net force of 730 N acts on a 16.0 kg object for 6.10 s. Calculate the magnitude of the change in velocity.',n:278,u:'m/s',w:'Δv = F Δt / m = (730)(6.10) / 16.0 = 278 m/s.'},
    {q:'A 15.0 kg object moves north at 400 m/s. It receives an impulse of 1700 N·s south. Calculate its final speed (the direction is north).',n:287,u:'m/s',w:'p<sub>f</sub> = (15.0)(400) − 1700 = 4300 kg·m/s north. v<sub>f</sub> = 4300 / 15.0 = 287 m/s north.'},
    {q:'A 79.0 N object hits the ground at 11.0 m/s down and goes back up at 6.50 m/s. Calculate the magnitude of the change in momentum.',n:141,u:U,w:'m = 79.0 / 9.81 = 8.053 kg. Δp = (8.053)(6.50 − (−11.0)) = 141 kg·m/s up.'},
    {q:'A bat changes the velocity of a 145 g baseball from 120 km/h forward to 140 km/h backward in 70.0 ms. Calculate the magnitude of the net force.',n:150,u:'N',tol:.03,w:'Δv = 260 km/h = 72.2 m/s. F = (0.145)(72.2) / 0.0700 = 150 N backward.'},
    {q:'A 4.20 Mg rocket receives an impulse of 1.08 × 10<sup>7</sup> N·s forward. Its final velocity is 3.90 km/s forward. Calculate its initial speed.',n:1330,u:'m/s',w:'p<sub>f</sub> = (4200)(3900) = 1.638 × 10⁷. p<sub>i</sub> = 1.638 × 10⁷ − 1.08 × 10⁷ = 5.58 × 10⁶ kg·m/s. v<sub>i</sub> = 1.33 km/s.'},
    {q:'Why is a climbing rope made of a material that stretches?',o:['It increases the stopping time, thus the force on the climber decreases.','It decreases the change in momentum of the climber.','It decreases the stopping time, thus the impulse decreases.','It increases the impulse on the climber.'],a:0,w:'The change in momentum is the same for each rope. A longer stopping time gives a smaller net force (F ∝ 1/t).'}]},
{t:'Conservation in 1-D',h:'Conservation of momentum in one dimension',d:'In an isolated system, the total momentum before an interaction is equal to the total momentum after it.',build(g){
  card(g,'Systems',`<ul><li>A <span class="key">system</span> is a collection of two or more masses.</li><li>An <span class="key">isolated system</span> does not exchange mass with the environment and has no net external force on it.</li></ul>
    ${CF(FIG.system(),'The dashed line is the boundary of the system. During the collision, the force on A and the force on B are equal in size and opposite in direction. No net force comes from outside, and no mass goes in or out.')}`,'half');
  card(g,'Law of conservation of momentum',`<p>In an isolated system, the total momentum before an interaction is equal to the total momentum after the interaction.</p>
    <div class="fx"><i>m</i><sub>A</sub><span class="vec"><i>v</i></span><sub>A</sub> + <i>m</i><sub>B</sub><span class="vec"><i>v</i></span><sub>B</sub> = <i>m</i><sub>A</sub><span class="vec"><i>v</i></span><sub>A</sub>′ + <i>m</i><sub>B</sub><span class="vec"><i>v</i></span><sub>B</sub>′</div>
    <h4>Where the law comes from</h4><ol><li>Newton's third law: during the collision, <span style="white-space:nowrap"><span class="vec"><i class="v">F</i></span><sub>A on B</sub> = −<span class="vec"><i class="v">F</i></span><sub>B on A</sub></span>.</li>
    <li>The two objects touch for the same time. Multiply each side by Δ<i class="v">t</i>: the impulse on B is equal and opposite to the impulse on A.</li>
    <li>Impulse is change in momentum, thus Δ<span class="vec"><i class="v">p</i></span><sub>B</sub> = −Δ<span class="vec"><i class="v">p</i></span><sub>A</sub>.</li>
    <li>The total change in momentum of the system is zero. The sum of the momenta before is equal to the sum after.</li></ol>
    <div class="note">One-dimensional problems: select a positive direction first. Give a negative sign to each velocity in the opposite direction.</div>`,'half');
  collisionLab(g,'p');
  explosionLab(g);
  card(g,'Worked examples',
    ex('A 30.0 g red ball moves at 30.0 cm/s [E] and hits a 50.0 g green ball that moves at 20.0 cm/s [W]. The red ball rebounds at 17.0 cm/s. Find the final velocity of the green ball.',`<p>Take east as positive. Before: (30.0)(30.0) + (50.0)(−20.0) = −100 g·cm/s.</p><p>After: (30.0)(−17.0) + (50.0) v = −100, thus v = (−100 + 510) / 50.0 = +8.20 cm/s. The green ball moves at 8.20 cm/s [E].</p>`)+
    ex('A car moves east at 65 km/h and hits a stationary 1200 kg truck. They lock together and move at 26 km/h. Find the mass of the car.',`<p>m(65) + 0 = (m + 1200)(26). Thus 39 m = 31 200 and m = 800 kg. The km/h units cancel, thus a conversion is not necessary here.</p>`));
},qz:[
    {q:'A 960 kg truck moves at 54 km/h and hits a stationary 710 kg car. They stick together. Calculate their speed after the collision.',n:8.62,u:'m/s',tol:.03,w:'54 km/h = 15 m/s. v′ = (960)(15) / (960 + 710) = 8.6 m/s (31 km/h).'},

  card(g,'Steps to write a Brønsted-Lowry reaction',`<ol><li>List all species that are present. Include the states. Do not forget water.</li><li>Write a strong acid as ${C('H3O^+')} and its anion.</li><li>Keep a weak acid in its molecular form.</li><li>Write a soluble ionic compound as its ions.</li>
    <li>Find the strongest acid (largest K<sub>a</sub>) and the strongest base. These are the reactants.</li><li>Move one proton from the acid to the base to get the products.</li><li>Balance the equation.</li></ol>
    <div class="note"><b>Fast rule:</b> if the acid is above the base on the table, the products are favoured. If the base is above the acid, the reactants are favoured.</div>
    ${CF(FIG.rule(),'The fast rule on the acid-base table. Blue: the acid. Orange: the base. The arrow shows the proton transfer.')}`,'half');
  const c=card(g,'Predict a reaction with the acid-base table',`<p class="hint">Select one acid from the left column and one base from the right column. The acids are in order from strongest (top) to weakest. Strong acids such as HCl are not shown because they exist as ${C('H3O^+(aq)')} in water.</p>`);
  const out=el('div',{class:'note'}),tb=el('div',{class:'scroll'});c.append(out,tb);let ai=8,bi=18;

  render();c.append(el('p',{class:'hint'},'These K<sub>a</sub> values are typical data-booklet values at 25 °C. Use the values in your own data booklet for assignments and exams, because some editions are different in the second digit.'));
  card(g,'Polyprotic acids',`<p>A polyprotic acid donates one proton at a time. Each step has its own K<sub>a</sub>. The values in the notepack for carbonic acid are:</p>
    <div class="fx">${C('H2CO3(aq) + H2O(l) <=> H3O^+(aq) + HCO3^-(aq)')} &nbsp; <i>K</i><sub>a</sub> = 4.4 × 10<sup>−7</sup><br>${C('HCO3^-(aq) + H2O(l) <=> H3O^+(aq) + CO3^2-(aq)')} &nbsp; <i>K</i><sub>a</sub> = 4.7 × 10<sup>−11</sup></div>
    <ul><li>The second K<sub>a</sub> is smaller, because the second proton comes off a negative ion.</li><li>The pH of a polyprotic acid solution comes from the first K<sub>a</sub>.</li><li>The second ionization occurs only if a base is added to remove the next proton.</li><li>The conjugate base of a polyprotic acid is amphiprotic. It is on the acid side and on the base side of the table.</li></ul>`);
},qz:[

    {q:C('A reaction in which HCO3^-(aq) acts as an acid and the reactants are favoured is'),o:[C('HCO3^- + HBO3^2- <=> H2BO3^- + CO3^2-'),C('HCO3^- + HPO4^2- <=> H2PO4^- + CO3^2-'),C('HCO3^- + CH3COOH <=> H2CO3 + CH3COO^-'),C('HCO3^- + HSO4^- <=> H2CO3 + SO4^2-')],a:1,w:'HCO₃⁻ (K<sub>a</sub> = 4.7 × 10⁻¹¹) is a weaker acid than H₂PO₄⁻ (6.2 × 10⁻⁸), thus the reactants are favoured. In the last two reactions, HCO₃⁻ acts as a base.'},

EQL.push({t:'pH',h:'pH and pOH calculations',d:'The pH scale is a logarithmic scale for the hydronium ion concentration.',build(g){

  dragOn(pv,(x,y)=>y>18&&y<96?1:null,(hh,x)=>{const w=pv.w,p=clamp((x-14)/((w-28)/15)-.5,0,14);K.set({p:Math.round(p*100)/100});});
  c.append(el('p',{class:'figcap'},'Drag the pointer or use the slider. The bars use a scale of powers of ten: one pH unit is one equal step.'));

  K=ctl(c,[{k:'p',l:'pH',min:0,max:14,step:.01,v:7,dp:2}],v=>{const p=v.p;R(0,p.toFixed(2));R(1,(14-p).toFixed(2));R(2,sig(10**-p,2)+' mol/L');R(3,sig(10**(p-14),2)+' mol/L');R(4,p<6.995?'Acidic':p>7.005?'Basic':'Neutral');pv.draw();});

    <div class="fx"><i>K</i><sub>a</sub> = <span class="frac"><span>[${C('H3O^+')}][${C('A^-')}]</span><span>[HA]</span></span> = <span class="frac"><span><i>x</i>²</span><span><i>C</i> − <i>x</i></span></span> ≈ <span class="frac"><span><i>x</i>²</span><span><i>C</i></span></span></div>

  const sh=el('div'),ch=el('div'),steps=el('div',{class:'note'});d.append(sh,ch,steps);let ty=0,K2;

    if(ty===2)defs.push({k:'n',l:'OH⁻ per formula unit',min:1,max:2,v:P[ty][0][1].n});
    K2=ctl(ch,defs,calc);btnRow(ch,P[ty].map(([t,o])=>[t,()=>K2.set(o),'ghost']));calc(K2.v);}
  function calc(v){const c=v.c;let h;

    else if(ty===2){const oh=c*v.n,poh=-Math.log10(oh);h=`<b>Strong base.</b> [OH⁻] = ${v.n} × ${sig(c,2)} = ${sig(oh,2)} mol/L.<br>pOH = −log(${sig(oh,2)}) = ${poh.toFixed(2)}<br>pH = 14.00 − ${poh.toFixed(2)} = <b>${(14-poh).toFixed(2)}</b>`;}

const INC={yellow:[242,200,30,1],red:[226,59,46,1],blue:[45,111,224,1],green:[58,166,85,1],orange:[240,138,36,1],pink:[242,79,156,1],colourless:[255,255,255,.1],'pale pink':[250,185,215,1],'pale blue':[171,197,243,1],'pale orange':[249,208,167,1]};
const MID={'yellow>blue':'green','blue>yellow':'green','red>yellow':'orange','yellow>red':'orange','colourless>pink':'pale pink','colourless>blue':'pale blue','colourless>orange':'pale orange'};
const IND=[['Methyl violet',[[0,1.6,'yellow','blue']]],['Cresol red',[[0,1,'red','yellow'],[7,8.8,'yellow','red']]],['Thymol blue',[[1.2,2.8,'red','yellow'],[8,9.6,'yellow','blue']]],['Orange IV',[[1.4,2.8,'red','yellow']]],['Methyl orange',[[3.2,4.4,'red','yellow']]],['Bromocresol green',[[3.8,5.4,'yellow','blue']]],['Methyl red',[[4.8,6,'red','yellow']]],['Chlorophenol red',[[5.2,6.8,'yellow','red']]],['Bromothymol blue',[[6,7.6,'yellow','blue']]],['Phenol red',[[6.6,8,'yellow','red']]],['Phenolphthalein',[[8.2,10,'colourless','pink']]],['Thymolphthalein',[[9.4,10.6,'colourless','blue']]],['Alizarin yellow R',[[10.1,12,'yellow','red']]],['Indigo carmine',[[11.4,13,'blue','yellow']]],['1,3,5-trinitrobenzene',[[12,14,'colourless','orange']]]];
function indState(ind,pH){const tr=ind[1];let name=tr[0][2],cssc=INC[name],lo=-1,hi=tr[0][0];
  for(let i=0;i<tr.length;i++){const [a,b,f,t]=tr[i];if(pH<a){break;}

 {q:'The area between the line of a net force-time graph and the time axis is equal to the',o:['impulse','work','acceleration','kinetic energy'],a:0,w:'Impulse = F Δt, which is the area on a force-time graph. The area on a force-displacement graph is work.'},
 {q:'An egg falls from the same height onto a pillow and onto a hard floor. Compared with the floor, the pillow gives the egg',o:['the same impulse, a longer stopping time and a smaller force','a smaller impulse and a smaller force','the same impulse, a shorter stopping time and a smaller force','a larger impulse and a longer stopping time'],a:0,w:'The change in momentum is the same. The pillow increases the time, thus the force decreases.'},
 {q:'A 2.0 kg object starts at rest. A net force of 15 N acts for 4.0 s and then a net force of −5.0 N acts for 6.0 s. Calculate its final velocity.',n:15,u:'m/s',w:'Impulse = (15)(4.0) + (−5.0)(6.0) = 30 N·s. v = 30 / 2.0 = 15 m/s.'}],
[{q:'A 2.0 kg cart moves right at 3.0 m/s and hits a 1.0 kg cart at rest. After the collision, the 2.0 kg cart moves right at 1.0 m/s. Calculate the speed of the 1.0 kg cart.',n:4,u:'m/s',w:'(2.0)(3.0) = (2.0)(1.0) + (1.0)v, thus v = 4.0 m/s right.'},
 {q:'A 60.0 kg skater at rest on ice throws a 5.00 kg ball forward at 12.0 m/s. Calculate the recoil speed of the skater.',n:1,u:'m/s',w:'(60.0)v = (5.00)(12.0), thus v = 1.00 m/s backward.'},
 {q:'Two carts collide on a frictionless track. The impulse on cart A is 6 N·s left. What is the change in momentum of cart B?',o:['6 kg·m/s right','6 kg·m/s left','0 kg·m/s','12 kg·m/s right'],a:0,w:'The impulses are equal and opposite, and impulse is equal to change in momentum.'},
 {q:'A 400 g object moves north at 16.0 m/s and hits a 700 g object that moves south. They stick together and move at 3.80 m/s south. Calculate the initial speed of the 700 g object.',n:15.1,u:'m/s',w:'Take north as positive: (0.400)(16.0) + (0.700)v = (1.100)(−3.80). v = −15.1 m/s, thus 15.1 m/s south.'},
 {q:'A 170 g ball moves east at 28 m/s and hits a 240 g cue ball that moves west at 19 m/s. After the collision, the 170 g ball moves west at 11 m/s. Calculate the final speed of the cue ball (it moves east).',n:8.6,u:'m/s',tol:.03,w:'Δp of the 170 g ball = (0.170)(−11 − 28) = −6.6 kg·m/s. The cue ball gains 6.6 kg·m/s east: −4.56 + 6.63 = 2.07 kg·m/s, thus 8.6 m/s east.'}],
[{q:'A 120 kg bomb at rest explodes into three pieces. A 46.0 kg piece moves at 50.0 m/s east. A 27.0 kg piece moves at 140 m/s south. Calculate the speed of the third piece.',n:94.1,u:'m/s',w:'The third piece has 47.0 kg and must cancel 2300 kg·m/s [E] and 3780 kg·m/s [S]: 4425 kg·m/s. v = 94.1 m/s at 58.7° N of W.'},
 {q:'A mass <i class="v">M</i> moves west at 12.0 m/s and hits a stationary 330 g object. After the collision, <i class="v">M</i> moves north at 7.00 m/s and the 330 g object moves at 15.0 m/s. Calculate <i class="v">M</i> in grams.',n:356,u:'g',w:'The 330 g object has 4.95 kg·m/s. Its components are 12.0M west and 7.00M south: M√(12.0² + 7.00²) = 4.95, thus M = 0.356 kg.'},
 {q:'Two momentum vectors are added: 30 kg·m/s [E] and 40 kg·m/s [N]. Calculate the magnitude of the total.',n:50,u:U,w:'√(30² + 40²) = 50 kg·m/s.'},
 {q:'For the vectors in the previous question, calculate the angle of the total, measured north of east.',n:53.1,u:'° N of E',w:'tan θ = 40 / 30, thus θ = 53.1° N of E.'},
 {q:'Three momentum vectors make a triangle that does not have a right angle. Which method finds the unknown side?',o:['The cosine law','The Pythagorean theorem','The tangent ratio only','Addition of the magnitudes'],a:0,w:'Use the cosine law with the angle opposite to the unknown side. Pythagoras is only for right triangles.'}],
[{q:'An object has a momentum of 50.0 kg·m/s at 30.0° N of E. Calculate its east component.',n:43.3,u:U,w:'p<sub>x</sub> = 50.0 cos 30.0° = 43.3 kg·m/s.'},
 {q:'Before a collision, object 1 has components 9.10 kg·m/s [E] and 6.80 kg·m/s [S], and object 2 has 7.20 kg·m/s [E] and 4.20 kg·m/s [N]. After it, object 1 has 11.40 kg·m/s [E] and object 2 has 5.10 kg·m/s [S]. Calculate the east component of object 2 after the collision.',n:4.90,u:U,w:'x direction: 9.10 + 7.20 = 11.40 + x, thus x = 4.90 kg·m/s.'},
 {q:'For the collision in the previous question, calculate the north component of object 1 after the collision.',n:2.50,u:U,w:'y direction: −6.80 + 4.20 = y − 5.10, thus y = +2.50 kg·m/s (north).'},
 {q:'Two objects hit and stick together. Object 1 has 3.12 kg·m/s at 51.0° S of W. Object 2 has a momentum <i class="v">p</i> at an angle N of W. Together they move west with 12.16 kg·m/s. Calculate <i class="v">p</i>.',n:10.5,u:U,w:'West: p<sub>x</sub> = 12.16 − 3.12 cos 51.0° = 10.20. North: p<sub>y</sub> = 3.12 sin 51.0° = 2.42. p = 10.5 kg·m/s at 13.4° N of W.'},
 {q:'A bomb at rest explodes into 3 pieces. Piece 1 has 187.2 kg·m/s at 11.0° N of W. Piece 2 has 194.4 kg·m/s at 40.0° N of E. Calculate the magnitude of the momentum of piece 3.',n:164,u:U,w:'x: −183.8 + 148.9 = −34.8, thus piece 3 has +34.8. y: 35.7 + 125.0 = 160.7, thus piece 3 has −160.7. p = 164 kg·m/s at 77.8° S of E.'},
 {q:'In the component method, which statement is correct?',o:['The x momentum and the y momentum are each conserved independently.','Only the x momentum is conserved.','The magnitudes of the momenta are added.','The components are added before they are resolved.'],a:0,w:'Total momentum is a vector, thus each of its components is the same before and after.'}],
[{q:'A 3.50 kg object moves at 18.0 m/s and has a head-on elastic collision with a 4.20 kg object that moves at 20.0 m/s. After the collision, the 4.20 kg object moves at 14.5 m/s. Calculate the final speed of the 3.50 kg object.',n:23.5,u:'m/s',w:'Use conservation of kinetic energy. E<sub>k</sub> before = 567 + 840 = 1407 J. After: 441.5 + ½(3.50)v² = 1407, thus v = 23.5 m/s.'},
 {q:'A 600 g ball starts at 7.00 m/s at the top of a frictionless hill that is 2.50 m high. Calculate its speed at the bottom.',n:9.90,u:'m/s',w:'v² = 7.00² + 2(9.81)(2.50) = 98.05, thus v = 9.90 m/s.'},

 {q:'A 2.0 kg object moves at 6.0 m/s and sticks to a 4.0 kg object at rest. What percent of the kinetic energy is lost?',n:66.7,u:'%',w:'v′ = 2.0 m/s. E<sub>k</sub> before = 36 J. E<sub>k</sub> after = 12 J. Loss = 24 J, which is 67%.'},
 {q:'Why do you not use direction when you calculate kinetic energy?',o:['Energy is a scalar.','Energy is always conserved.','Velocity has no direction in a collision.','Kinetic energy is a vector with a constant direction.'],a:0,w:'Kinetic energy depends on v², which has no direction.'}],
[{q:'The total momentum of two objects before a collision in an isolated system is 50 kg·m/s right. What is the total momentum after the collision?',o:['50 kg·m/s right','50 kg·m/s left','0 kg·m/s','It depends on the type of collision.'],a:0,w:'Total momentum is conserved in elastic and inelastic collisions.'},
 {q:'An object with 50 N·s east hits an object at rest. After the collision, the first object has components of 20 N·s [E] and 11 N·s [N]. Calculate the east component of the second object.',n:30,u:'N·s',w:'x: 50 = 20 + x, thus x = 30 N·s. The y component is −11 N·s.'},
 {q:'Two identical masses move toward each other at the same speed <i class="v">v</i> and stick together. What is their final speed?',o:['0','½<i class="v">v</i>','<i class="v">v</i>','2<i class="v">v</i>'],a:0,w:'The total momentum before is zero, thus they come to rest.'},
 {q:'Which pair gives the two methods to calculate impulse?',o:['<i class="v">F</i><sub>net</sub>Δ<i class="v">t</i> and <i class="v">m</i>Δ<i class="v">v</i>','<i class="v">mv</i> and ½<i class="v">mv</i>²','<i class="v">Fd</i> and <i class="v">mgh</i>','<i class="v">ma</i> and <i class="v">mg</i>'],a:0,w:'Impulse = F<sub>net</sub>Δt = mΔv = Δp.'},
 {q:'In a rocket launch, which combination gives the maximum final velocity?',o:['Maximum force, maximum time and minimum mass','Maximum force, minimum time and maximum mass','Minimum force, maximum time and minimum mass','Maximum force, minimum time and minimum mass'],a:0,w:'Δv = FΔt / m. A large impulse on a small mass gives the largest change in velocity.'}]],
eq:[
[{q:'At equilibrium, the concentrations of the reactants and the products are',o:['constant','always equal to each other','always zero for the reactants','increasing at equal rates'],a:0,w:'The concentrations stay constant. They are usually not equal to each other.'},
 {q:C('For N2O4(g) <=> 2NO2(g), a flask starts with only N2O4. While the system goes to equilibrium,'),o:['the forward rate decreases and the reverse rate increases','the forward rate increases and the reverse rate decreases','the two rates increase','the two rates decrease'],a:0,w:'The reactant is used and the product is made, until the two rates are equal.'},
 {q:C('N2O4 is colourless and NO2 is brown. Which observation shows that a closed flask of these gases is at equilibrium?'),o:['The colour of the mixture stays constant.','The mixture is colourless.','The colour becomes darker at a constant rate.','The flask has equal moles of the two gases.'],a:0,w:'A constant macroscopic property shows equilibrium.'},
 {q:'Which system is closed?',o:['A sealed bottle of carbonated water','An open beaker of boiling water','A candle that burns in air','A cup of hot tea'],a:0,w:'Matter cannot go in or out of a sealed bottle. Energy can.'}],
[{q:C('For SO3(g) + NO(g) <=> NO2(g) + SO2(g), the equilibrium concentrations are 0.150 mol/L for SO3 and for NO, and 0.250 mol/L for NO2 and for SO2. Calculate Kc.'),n:2.78,w:'K<sub>c</sub> = (0.250)(0.250) / ((0.150)(0.150)) = 2.78.'},
 {q:C('For CO(g) + H2O(g) <=> H2(g) + CO2(g), Kc = 4.06. At equilibrium, [CO] = [H2] = [CO2] = 0.100 mol/L. Calculate [H2O].'),n:.0246,u:'mol/L',w:'[H₂O] = (0.100)(0.100) / ((4.06)(0.100)) = 0.0246 mol/L.'},
 {q:C('A 10.0 L flask at equilibrium holds 2.0 mol PCl5(s), 0.30 mol H2O(g), 0.60 mol HCl(g) and 0.30 mol POCl3(g). Calculate Kc for PCl5(s) + H2O(g) <=> 2HCl(g) + POCl3(g).'),n:.0036,w:'The solid is not in the expression. K<sub>c</sub> = (0.060)²(0.030) / 0.030 = 3.6 × 10⁻³.'},
 {q:C('For SO2(g) + NO2(g) <=> NO(g) + SO3(g), Kc = 4.2. At equilibrium, [SO2] = 0.010 mol/L, [NO2] = 0.020 mol/L and [NO] = 0.030 mol/L. Calculate [SO3].'),n:.028,u:'mol/L',w:'[SO₃] = (4.2)(0.010)(0.020) / 0.030 = 0.028 mol/L.'},
 {q:C('Kc = 78 for CO(g) + 3H2(g) <=> CH4(g) + H2O(g). A 2.0 L container at equilibrium holds 0.800 mol CO, 0.600 mol H2 and 0.200 mol H2O. Calculate [CH4].'),n:8.4,u:'mol/L',tol:.03,w:'Concentrations: 0.400, 0.300 and 0.100 mol/L. [CH₄] = (78)(0.400)(0.300)³ / 0.100 = 8.4 mol/L.'},
 {q:C('The equilibrium C(s) + H2O(g) <=> H2(g) + CO(g) is'),o:['heterogeneous, because the substances are not all in the same phase','homogeneous, because the products are gases','heterogeneous, because the coefficients are equal','homogeneous, because it is in a closed system'],a:0,w:'A solid and gases are present, thus the equilibrium is heterogeneous.'}],
[{q:C('0.800 mol of SO3 and 0.800 mol of NO are put in a 2.00 L flask. At equilibrium, [SO2] = 0.100 mol/L. Calculate Kc for SO3(g) + NO(g) <=> NO2(g) + SO2(g).'),n:.111,w:'Initial: 0.400 mol/L each. Equilibrium: 0.300, 0.300, 0.100, 0.100. K<sub>c</sub> = (0.100)² / (0.300)² = 0.111.'},
 {q:C('2.00 mol of N2O is put in a 1.00 L flask. At equilibrium, 0.200 mol of O2 is present. Calculate Kc for 2N2O(g) <=> 2N2(g) + O2(g).'),n:.0125,w:'Changes: −0.400, +0.400, +0.200. K<sub>c</sub> = (0.400)²(0.200) / (1.60)² = 0.0125.'},
 {q:C('6.00 mol of SO2 and 8.00 mol of SO3 are put in a 4.0 L container. At equilibrium, 2.00 mol of O2 is present. Calculate Kc for 2SO2(g) + O2(g) <=> 2SO3(g).'),n:.32,w:'The system shifts left. [O₂] = 0.50, [SO₂] = 1.50 + 1.00 = 2.50 and [SO₃] = 2.00 − 1.00 = 1.00 mol/L. K<sub>c</sub> = 1.00² / (2.50² × 0.50) = 0.32.'},
 {q:C('In an ICE table for N2(g) + 3H2(g) <=> 2NH3(g), the change for N2 is −<i class="v">x</i>. What is the change for NH3?'),o:['+2<i class="v">x</i>','+<i class="v">x</i>','−2<i class="v">x</i>','+3<i class="v">x</i>'],a:0,w:'The changes follow the coefficients. NH₃ is a product with a coefficient of 2.'}],
[{q:C('For 2SO3(g) <=> 2SO2(g) + O2(g) with ΔH = +197 kJ, the temperature is increased. What occurs?'),o:['The system shifts right and K<sub>c</sub> increases.','The system shifts right and K<sub>c</sub> does not change.','The system shifts left and K<sub>c</sub> decreases.','The system shifts left and K<sub>c</sub> increases.'],a:0,w:'The reaction is endothermic, thus energy is a reactant. Added energy shifts it right and K<sub>c</sub> increases.'},
 {q:C('For CO(g) + 2H2(g) <=> CH3OH(g) with ΔH = −18 kJ, the temperature is decreased. What occurs to [CH3OH]?'),o:['It increases.','It decreases.','It does not change.','It becomes zero.'],a:0,w:'The reaction is exothermic. A lower temperature shifts it right, toward the side with the energy term.'},
 {q:C('For CO2(g) + H2(g) + heat <=> CO(g) + H2O(g), the pressure is decreased by an increase in volume. What occurs?'),o:['There is no shift, because the two sides have equal moles of gas.','The system shifts right.','The system shifts left.','K<sub>c</sub> increases.'],a:0,w:'There are 2 mol of gas on each side. A volume change does not shift this system.'},
 {q:C('In a saturated solution, Na2SO4(s) <=> 2Na^+(aq) + SO4^2-(aq). BaCl2 is added and solid BaSO4 forms. What occurs?'),o:['The equilibrium shifts right and more solid sodium sulfate dissolves.','The equilibrium shifts left.','There is no shift.','K<sub>c</sub> increases.'],a:0,w:'The barium ions remove sulfate ions. The system shifts right to replace them.'},
 {q:'A system at equilibrium is stressed and shifts to the right. Compared with the initial equilibrium, the new equilibrium has',o:['more products and fewer reactants','more reactants and fewer products','the same concentrations','no reactants'],a:0,w:'A shift to the right uses reactants and makes products.'},
 {q:'On an equilibrium graph, one line has a sudden vertical step and then all lines adjust slowly. Which stress was applied?',o:['The concentration of one substance was changed.','The temperature was changed.','The volume was changed.','A catalyst was added.'],a:0,w:'Only the substance that was added or removed has the vertical step.'}],
[{q:C('What is the conjugate acid of HPO4^2-(aq)?'),o:[C('H2PO4^-(aq)'),C('PO4^3-(aq)'),C('H3PO4(aq)'),C('H3O^+(aq)')],a:0,w:'Add one proton to the base to get its conjugate acid.'},
 {q:'Which pair is a conjugate acid-base pair?',o:[C('NH4^+ and NH3'),C('H3O^+ and OH^-'),C('H2SO4 and SO4^2-'),C('HCl and NaOH')],a:0,w:'A conjugate pair is different by exactly one proton.'},
 {q:C('In HSO4^-(aq) + H2O(l) <=> H3O^+(aq) + SO4^2-(aq), water acts as'),o:['a base, because it accepts a proton','an acid, because it donates a proton','a conjugate acid','a catalyst'],a:0,w:'Water accepts the proton from HSO₄⁻ and becomes H₃O⁺.'},

[{q:C('The Ka of HCOOH(aq) is 1.8 × 10<sup>−4</sup>. Calculate the Kb of HCOO^-(aq).'),n:5.6e-11,tol:.03,w:'K<sub>b</sub> = (1.0 × 10⁻¹⁴) / (1.8 × 10⁻⁴) = 5.6 × 10⁻¹¹.'},

 {q:'Ammonia solution is mixed with hydrochloric acid. Which net ionic equation is correct?',o:[C('NH3(aq) + H3O^+(aq) -> NH4^+(aq) + H2O(l)'),C('NH3(aq) + HCl(aq) -> NH4Cl(aq)'),C('NH4^+(aq) + OH^-(aq) -> NH3(aq) + H2O(l)'),C('H3O^+(aq) + OH^-(aq) -> 2H2O(l)')],a:0,w:'Write the strong acid as H₃O⁺. The strongest base that is present is NH₃.'}],

function G(o){const n=(o.s||[]).filter(x=>x.n).length,leg=n>1,W=o.w||460,H=(o.h||236)+(leg?20:0),L=52,R=o.r||16,T=14+(leg?22:0),B=40,X=x=>L+(x-o.x[0])/(o.x[1]-o.x[0])*(W-L-R),Y=y=>H-B-(y-o.y[0])/(o.y[1]-o.y[0])*(H-T-B),cs=['var(--s1)','var(--s2)','var(--s3)','var(--s4)'],f=v=>v.toFixed(1);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.alt||'Graph'}" font-size="11.5">`;
  (o.yt||[]).forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${f(Y(v))}" y2="${f(Y(v))}" stroke="var(--gridc)"/><text x="${L-7}" y="${f(Y(v)+4)}" text-anchor="end" fill="var(--mute)">${String(v).replace('-','−')}</text>`;});
  (o.xt||[]).forEach(v=>{s+=`<line y1="${T}" y2="${H-B}" x1="${f(X(v))}" x2="${f(X(v))}" stroke="var(--gridc)"/><text x="${f(X(v))}" y="${H-B+16}" text-anchor="middle" fill="var(--mute)">${v}</text>`;});
  s+=`<line x1="${L}" x2="${W-R}" y1="${f(Y(o.y[0]<0?0:o.y[0]))}" y2="${f(Y(o.y[0]<0?0:o.y[0]))}" stroke="var(--axis)"/>`;
  s+=`<text x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--ink2)">${o.xl||''}</text><text transform="translate(11 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle" font-size="12" fill="var(--ink2)">${o.yl||''}</text>`;
  let lx=L;(o.s||[]).forEach((se,i)=>{s+=`<polyline fill="none" stroke="${cs[i%4]}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${se.p.map(p=>f(X(p[0]))+','+f(Y(p[1]))).join(' ')}"/>`;
    if(leg&&se.n){s+=`<line x1="${lx}" x2="${lx+16}" y1="14" y2="14" stroke="${cs[i%4]}" stroke-width="2.6" stroke-linecap="round"/><text x="${lx+22}" y="18" font-size="12" fill="var(--ink2)">${se.n}</text>`;lx+=22+se.n.length*7.2+18;}});
  /* names at the line ends, moved apart when the lines end close together */
  const ends=(o.s||[]).map((se,i)=>se.n?{n:se.n,c:cs[i%4],x:X(se.p[se.p.length-1][0]),y0:Y(se.p[se.p.length-1][1])}:null).filter(Boolean).sort((p,q)=>p.y0-q.y0);
  ends.forEach((e,i)=>{e.y=i?Math.max(e.y0,ends[i-1].y+14):e.y0;});for(let i=ends.length-1;i>=0;i--){const mx=H-B-2-(ends.length-1-i)*14;if(ends[i].y>mx)ends[i].y=mx;}
  ends.forEach(e=>{s+=`<circle cx="${f(e.x)}" cy="${f(e.y0)}" r="3.6" fill="${e.c}" stroke="var(--fig)" stroke-width="1.6"/>`+(Math.abs(e.y-e.y0)>2?`<path d="M${f(e.x+4)},${f(e.y0)} L${f(e.x+9)},${f(e.y)}" stroke="var(--axis)" fill="none"/>`:'')+`<text x="${f(e.x+11)}" y="${f(e.y+4)}" font-weight="600" fill="var(--ink)">${e.n}</text>`;});
  (o.m||[]).forEach(m=>{s+=`<circle cx="${f(X(m[0]))}" cy="${f(Y(m[1])-5)}" r="10" fill="var(--fig)" stroke="var(--gridc)"/><text x="${f(X(m[0]))}" y="${f(Y(m[1]))}" text-anchor="middle" font-weight="700" font-size="13" fill="var(--ink)">${m[2]}</text>`;});
  return s+'</svg>';}

/* ----- weekly goal: 4 study days in each week (Monday to Sunday) ----- */
function weekStart(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d;}
function weekCount(ws){const days=new Set(gv('days')||[]);let n=0;for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(d.getDate()+i);if(days.has(dayOf(d.getTime())))n++;}return n;}
function weeksInRow(){const ws=weekStart(new Date());let k=0;if(weekCount(ws)<4)ws.setDate(ws.getDate()-7);while(k<300&&weekCount(ws)>=4){k++;ws.setDate(ws.getDate()-7);}return k;}
function totalWeeksMet(){const m={};(gv('days')||[]).forEach(d=>{const [y,mo,da]=d.split('-').map(Number),k=dayOf(weekStart(new Date(y,mo-1,da)).getTime());m[k]=(m[k]||0)+1;});return Object.values(m).filter(n=>n>=4).length;}
function markStudy(){const td=today(),d=gv('days')||[];if(d.includes(td))return;gset('days',d.concat(td).slice(-400));
  if(weekCount(weekStart(new Date()))===4)toast(icon('cal',15)+' Weekly goal met: you studied on 4 days this week.');}

/* ----- one question at a time, with optional time limit. Used by the daily challenge, mastery practice and the boss round. ----- */
function runRound(box,o){let i=0,over=false,tm=0;const res=[],t0=Date.now(),n=o.items.length,off=o.offset||0,tot=o.total||n;
  if(!n){o.done(res,0,false);return;}
  const fin=to=>{if(over)return;over=true;clearInterval(tm);o.done(res,Date.now()-t0,to);};
  if(o.limit)tm=setInterval(()=>{if(!box.isConnected){clearInterval(tm);over=true;return;}const left=o.limit-(Date.now()-t0),t=$('[data-t]',box);if(t){t.textContent=fmtT(left)+' left';t.classList.toggle('low',left<30000);}if(left<=0)fin(true);},250);
  function ask(){const x=o.items[i];
    box.innerHTML=`<div class="qh"><b>${o.title||'Question'} ${off+i+1} of ${tot}</b>${o.limit?`<span class="score" data-t>${fmtT(o.limit-(Date.now()-t0))} left</span>`:`<span class="score" data-c>${res.filter(r=>r.ok).length} correct</span>`}</div>
      <div class="bar2" style="margin:.4em 0 .7em"><i class="b2" style="width:${100*(off+i)/tot}%"></i></div><p class="hint" style="margin:0">${SUBJ[x.sk].name} · ${SUBJ[x.sk].lessons[x.L].t}</p>`;
    const nx=el('button',{type:'button',class:'btn',disabled:''},i+1<n?'Next question':'Finish');
    box.append(qEl(x.it,'',null,e=>{if(over)return;res.push({x,ok:e.ok?1:0});onAnswer(x.id,!!e.ok,{sk:x.sk,L:x.L});srMark(x.id,!!e.ok);o.step&&o.step(res);
      nx.disabled=false;$('.b2',box).style.width=100*(off+i+1)/tot+'%';const sc=$('[data-c]',box);if(sc)sc.textContent=res.filter(r=>r.ok).length+' correct';},true));
    const row=el('div',{class:'row'});row.append(nx);box.append(row);nx.onclick=()=>{if(over)return;i++;i<n?ask():fin(false);};}
  ask();}
